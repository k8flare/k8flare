name: Cost Gate

on:
  workflow_dispatch:
# Manual-dispatch only, deliberately: this gate is expensive (a real k3s
# agent, containerd and the upstream e2e suite) and the Actions quota is
# limited. The cheap gate (ci.yml) runs automatically on every pull
# request instead. A fork contributor cannot dispatch this one -- a
# maintainer runs it before merge; see CONTRIBUTING.md.

# Asserts k8flare's core cost invariant (CLAUDE.md: "idle cluster cost
# approaches storage cost alone") against a real, local `wrangler dev`
# instance -- not by reading source and asserting it "should" be true
# (CLAUDE.md inviolable rule #2: verify by actually running it).
#
# What this proves, and how:
#   (a) the Cluster/Controllers Durable Objects' safety-net alarms park
#       (no next-scheduled-fire) once there's no live Node/Service left --
#       read directly from Miniflare's on-disk alarm store
#       (.wrangler/state/v3/do/<worker>-<Class>/metadata.sqlite's
#       `_cf_ALARM` table), the same mechanism a previous manual check used
#       (docs/cost-model.md's "Phase 4 (storage v2) actuals" section) but
#       now committed as an automated, non-invasive regression gate: no
#       debug endpoint is added to either Worker to make this observable.
#   (b) no DO-billable operation (alarm fire, facet access, or any other
#       fetch()-triggered work) happens while idle: Durable Objects only
#       ever execute in response to fetch()/alarm()/a WebSocket message --
#       nothing else can wake one. So "the alarm is parked" (a) plus "zero
#       new requests reached either Worker" (observed via wrangler dev's
#       own request-logged output, which is silent unless a request comes
#       in) together are sufficient to prove (b) by construction: with no
#       armed alarm and no incoming request, there is no code path left
#       that could touch a facet or do anything else billable.
#   (c) the controllers Durable Object (the DO-hosted kube-controller-manager --
#       see docs/platform-verification.md's S8 section) produces no
#       further activity once idle. [Updated 2026-07-30: the size problem
#       that text described was solved by the Worker Loader route -- the
#       control-plane binaries ship as Static Assets chunks and run as
#       dynamic workers, so kcm/gc/sched/clusterop ARE deployed today.
#       What this job measures is unchanged.] This job can only
#       measure that locally (no new log lines/requests) -- it cannot
#       reproduce S8(b)'s production `wrangler tail` CPU-ms measurement
#       (~0.4-0.5ms CPU/wall-second measured 2026-07-02), since there is no
#       production deployment to measure against in CI. The "zero
#       activity" signal here is the CI-feasible proxy the v2 rewrite
#       plan's Phase 6 section anticipated for exactly this case; treat
#       S8(b)'s method as the manual/production procedure to re-run if
#       the controllers DO ever becomes deployable.

jobs:
  cost-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"

      - name: Enable corepack (installed from npm -- runner Node images stopped bundling it, 2026-07)
        run: npm install -g corepack@latest && corepack enable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: pnpm install

      # Both apiserver and controllers are needed here (unlike ci.yml/
      # release.yml, which only need apiserver): this job's item (c)
      # specifically exercises the Controllers DO.
      - name: Install binaryen (wasm-opt) -- pinned release, not apt
        # Pinned to the same version developers use locally (mise
        # aqua:web-assembly/binaryen). apt/ubuntu ships an older binaryen
        # whose -Oz optimizes measurably worse: the SAME source
        # measured 65,204,713 bytes locally (version_129) but 67,222,931
        # bytes (+2.0MB, 111KiB OVER the 64MiB Loader cap) with apt's
        # binaryen on CI -- found 2026-07-10 when the e2e workflow's
        # Build WASM step failed while local builds passed. wasm-opt
        # version is part of the size gate's reproducibility.
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo "/opt/binaryen-version_129/bin" >> "$GITHUB_PATH"

      - name: Build WASM
        run: npm run build:wasm

      # Not guaranteed present on every ubuntu-latest image -- installed
      # defensively regardless, same rationale as e2e-conformance.yml's
      # iptables step. Used to read Miniflare's alarm store directly
      # instead of adding a debug HTTP endpoint to either Worker.
      - name: Install sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      # Token/no-TLS rationale: this job only ever speaks to the stack via
      # curl (never kubectl/client-go), so plain HTTP + a bearer header is
      # fine -- unlike e2e-conformance.yml, which needs TLS because
      # client-go's clientcmd refuses to send credentials over plain HTTP
      # (see docs/development.md). One Worker is started -- since the 2026-07-06
      # consolidation there is only one deployable Worker, and the control
      # plane runs inside it as dynamic workers. The Controllers DO is
      # exercised indirectly, through the Cluster DO's pingControllers()
      # on a relevant write, not by a direct request.

      # NOTE: no --local here, unlike make dev. Deliberate and verified
      # (2026-07-30): with no credentials in the environment -- which is
      # CI -- wrangler does not attempt the MESH remote-proxy session and
      # dev starts normally. Adding --local would also be fine; running
      # this locally on a logged-in machine is what needs the flag.
      - name: Start wrangler dev (real Workers + Durable Object storage)
        run: |
          nohup npx wrangler dev \
            -c packages/k8flare-worker/wrangler.jsonc \
            --enable-containers=false \
            --port 8787 \
            --persist-to .wrangler/state \
            --log-level info \
            > "$RUNNER_TEMP/wrangler.log" 2>&1 &

          echo "Waiting for wrangler dev on 127.0.0.1:8787..."
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null "http://127.0.0.1:8787/"; then
              break
            fi
            sleep 1
          done

          curl -sf -o /dev/null http://127.0.0.1:8787/api/v1/namespaces \
            -H "Authorization: Bearer k8flare-dev-token" || {
            echo "::error::wrangler dev did not come up cleanly"
            cat "$RUNNER_TEMP/wrangler.log"
            exit 1
          }

      # Cluster's schema bootstrap seeds default namespaces on first touch
      # (see the request just above), but hasPendingSafetyNetWork() only
      # looks at Nodes/Services -- so a cluster that has never had either
      # must come up with no alarm scheduled at all, not just "scheduled
      # far in the future". Confirmed empirically against this exact
      # mechanism before being committed here (not assumed from source).
      - name: Verify a fresh cluster starts fully parked
        run: |
          CLUSTER_DB=".wrangler/state/v3/do/k8flare-Cluster/metadata.sqlite"
          CONTROLLERS_DB=".wrangler/state/v3/do/k8flare-Controllers/metadata.sqlite"
          CLUSTER_ALARMS=$(sqlite3 -cmd ".timeout 5000" "$CLUSTER_DB" "SELECT count(*) FROM _cf_ALARM;")
          CONTROLLERS_ALARMS=$(sqlite3 -cmd ".timeout 5000" "$CONTROLLERS_DB" "SELECT count(*) FROM _cf_ALARM;")
          echo "Cluster alarm rows: $CLUSTER_ALARMS, Controllers alarm rows: $CONTROLLERS_ALARMS"
          if [ "$CLUSTER_ALARMS" != "0" ] || [ "$CONTROLLERS_ALARMS" != "0" ]; then
            echo "::error::a cluster with no Nodes/Services yet has a scheduled alarm -- cost invariant #1/#3 violated at rest" >&2
            exit 1
          fi

      - name: Create a Node and a Service (real write activity)
        run: |
          curl -sf -X POST http://127.0.0.1:8787/api/v1/nodes \
            -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
            -d '{"apiVersion":"v1","kind":"Node","metadata":{"name":"cost-gate-node"},"spec":{}}' \
            -o /dev/null

          curl -sf -X POST http://127.0.0.1:8787/api/v1/namespaces/default/services \
            -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
            -d '{"apiVersion":"v1","kind":"Service","metadata":{"name":"cost-gate-svc"},"spec":{"ports":[{"port":80}]}}' \
            -o /dev/null

      - name: Verify the safety-net alarm arms in response to write activity
        run: |
          CLUSTER_DB=".wrangler/state/v3/do/k8flare-Cluster/metadata.sqlite"
          CONTROLLERS_DB=".wrangler/state/v3/do/k8flare-Controllers/metadata.sqlite"
          for i in $(seq 1 15); do
            CLUSTER_ALARMS=$(sqlite3 -cmd ".timeout 5000" "$CLUSTER_DB" "SELECT count(*) FROM _cf_ALARM;")
            CONTROLLERS_ALARMS=$(sqlite3 -cmd ".timeout 5000" "$CONTROLLERS_DB" "SELECT count(*) FROM _cf_ALARM;")
            echo "t+${i}s: Cluster=$CLUSTER_ALARMS Controllers=$CONTROLLERS_ALARMS"
            if [ "$CLUSTER_ALARMS" != "0" ] && [ "$CONTROLLERS_ALARMS" != "0" ]; then
              echo "Both armed."
              exit 0
            fi
            sleep 1
          done
          echo "::error::writing a live Node/Service did not arm the safety-net alarm within 15s -- either a functional regression, or event-armed wake-up is broken" >&2
          cat "$RUNNER_TEMP/wrangler.log"
          exit 1

      - name: Delete the Node and Service
        run: |
          curl -sf -X DELETE http://127.0.0.1:8787/api/v1/nodes/cost-gate-node \
            -H "Authorization: Bearer k8flare-dev-token" -o /dev/null
          curl -sf -X DELETE http://127.0.0.1:8787/api/v1/namespaces/default/services/cost-gate-svc \
            -H "Authorization: Bearer k8flare-dev-token" -o /dev/null

      # SAFETY_NET_INTERVAL_MS is 60s in both
      # packages/k8flare-worker/src/storage/index.ts and
      # packages/k8flare-worker/src/controllers/index.ts, so parking can take up to
      # ~60s from the deletes above (the alarm has to fire once more,
      # re-evaluate, and choose not to re-arm) -- poll rather than a fixed
      # sleep, but budget for the full interval plus margin.
      - name: Verify the safety-net alarm parks once there is no live work (cost invariants #1/#3)
        run: |
          CLUSTER_DB=".wrangler/state/v3/do/k8flare-Cluster/metadata.sqlite"
          CONTROLLERS_DB=".wrangler/state/v3/do/k8flare-Controllers/metadata.sqlite"
          for i in $(seq 1 18); do
            CLUSTER_ALARMS=$(sqlite3 -cmd ".timeout 5000" "$CLUSTER_DB" "SELECT count(*) FROM _cf_ALARM;")
            CONTROLLERS_ALARMS=$(sqlite3 -cmd ".timeout 5000" "$CONTROLLERS_DB" "SELECT count(*) FROM _cf_ALARM;")
            echo "t+$((i * 5))s: Cluster=$CLUSTER_ALARMS Controllers=$CONTROLLERS_ALARMS"
            if [ "$CLUSTER_ALARMS" = "0" ] && [ "$CONTROLLERS_ALARMS" = "0" ]; then
              echo "Both parked."
              exit 0
            fi
            sleep 5
          done
          echo "::error::alarm did not park within 90s of deleting the last live Node/Service -- an idle cluster would keep costing alarm invocations forever (cost invariant #1/#3 violated)" >&2
          cat "$RUNNER_TEMP/wrangler.log"
          exit 1

      # The strongest available proxy for "no billable DO work happens
      # while idle": wrangler dev logs one line per request it handles, so
      # an unchanged line count over a sustained window with zero requests
      # sent means neither Worker executed at all (no alarm fire, no
      # facet access, nothing) -- see this file's header comment for why
      # that's sufficient to stand in for (b) and the local-only part of (c).
      - name: Verify a sustained idle cluster produces zero further activity
        run: |
          BEFORE=$(wc -l < "$RUNNER_TEMP/wrangler.log")
          echo "Log lines before idle window: $BEFORE"
          sleep 30
          AFTER=$(wc -l < "$RUNNER_TEMP/wrangler.log")
          echo "Log lines after 30s idle window: $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::idle cluster produced new Worker activity with zero requests sent -- cost invariant #1 violated" >&2
            tail -n +"$((BEFORE + 1))" "$RUNNER_TEMP/wrangler.log"
            exit 1
          fi

      - name: Tear down background processes
        if: always()
        run: pkill -f "wrangler dev" || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cost-gate-logs
          path: |
            ${{ runner.temp }}/wrangler.log
          if-no-files-found: ignore
