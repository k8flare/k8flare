name: E2E

on:
  push:
    branches: [main, feat/minimal-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            scripts/go.sum

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install binaryen
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo /opt/binaryen-version_129/bin >> "$GITHUB_PATH"

      - name: Restore optimized workers
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/wasm/*.opt.wasm
            .build/wasm/*.opt.wasm.sha256
          key: wasm-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'packages/**/*.go', 'scripts/mirror/**') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Build
        id: build
        run: scripts/ci/e2e.sh build

      - name: Save optimized workers
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            .build/wasm/*.opt.wasm
            .build/wasm/*.opt.wasm.sha256
          key: wasm-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'packages/**/*.go', 'scripts/mirror/**') }}

      - name: Start the control plane and a node
        run: scripts/ci/e2e.sh up

      - name: Run the required e2e set
        run: scripts/ci/e2e.sh test
        env:
          SET: required

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            .build/ci/logs
            .build/e2e/report
          retention-days: 7
          if-no-files-found: ignore
