name: E2E

on:
  push:
    branches: [main, feat/minimal-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-wasm-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-wasm-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-
            go-wasm-${{ runner.os }}-

      - name: Install binaryen
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo /opt/binaryen-version_129/bin >> "$GITHUB_PATH"

      - name: Restore optimized workers
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/wasm/*.opt.wasm
            .build/wasm/*.opt.wasm.sha256
          key: wasm-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'packages/**/*.go', 'scripts/mirror/**') }}
          restore-keys: wasm-${{ runner.os }}-shard${{ matrix.shard }}-

      - name: Build this shard's workers
        id: build
        run: scripts/ci/e2e.sh shard ${{ matrix.shard }} 8

      - name: Save optimized workers
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            .build/wasm/*.opt.wasm
            .build/wasm/*.opt.wasm.sha256
          key: wasm-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'packages/**/*.go', 'scripts/mirror/**') }}

      - name: Save Go caches
        if: always() && steps.build.outcome == 'success' && matrix.shard == 0
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-wasm-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: workers-${{ matrix.shard }}
          path: |
            .build/wasm/*.wasm
            .build/wasm/*.sha256
          retention-days: 1
          if-no-files-found: error

  required:
    needs: workers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-linux-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-
            go-linux-${{ runner.os }}-

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install binaryen
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo /opt/binaryen-version_129/bin >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          pattern: workers-*
          path: .build/wasm
          merge-multiple: true

      - name: Build
        id: build
        run: scripts/ci/e2e.sh build

      - name: Start the control plane and a node
        run: scripts/ci/e2e.sh up

      - name: Run the required e2e set
        run: scripts/ci/e2e.sh test
        env:
          SET: required
          SHARD: ${{ matrix.shard }}
          SHARDS: 3

      - name: Save Go caches
        if: always() && steps.build.outcome == 'success' && matrix.shard == 0
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.shard }}
          path: |
            .build/ci/logs
            .build/e2e/report
          retention-days: 7
          if-no-files-found: ignore

  live:
    needs: workers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-linux-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-
            go-linux-${{ runner.os }}-

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install binaryen
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo /opt/binaryen-version_129/bin >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          pattern: workers-*
          path: .build/wasm
          merge-multiple: true

      - name: Build
        run: scripts/ci/e2e.sh build

      - name: Run the wrangler-backed apiserver tests
        shell: bash
        env:
          CGO_ENABLED: "0"
          X_LOCAL_OBSERVABILITY: "false"
          MINIFLARE_WORKERD_V8_FLAGS: "--single-threaded-gc"
          TMPDIR: ${{ github.workspace }}/.build/ci/tmp
        run: |
          mkdir -p .build/ci/logs .build/ci/tmp
          go test -count=1 -timeout 70m \
            -run '^(TestAdmissionExtensions|TestCompaction|TestConfigMapVerbs|TestControllers|TestCustomResources|TestInformerWatchList|TestOpenAPI|TestNodePodCIDRAndPodLifecycle|TestRBAC|TestScheduler|TestSchedulerWakesOnNode|TestSupervisorJoin|TestTables|TestWatch|TestWatchSelectorTransitions|TestNodeFieldSelectorDefaults)$' \
            ./packages/apiserver/... 2>&1 | tee .build/ci/logs/live.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-logs
          path: |
            .build/ci/logs
            .build/ci/tmp/**/wrangler.log
          retention-days: 7
          if-no-files-found: ignore
