name: Conformance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      focus:
        description: Ginkgo focus regex that replaces the Conformance set, to run single specs
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: conformance
  cancel-in-progress: false

jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-wasm-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-wasm-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-
            go-wasm-${{ runner.os }}-

      - name: Install binaryen
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo /opt/binaryen-version_129/bin >> "$GITHUB_PATH"

      - name: Restore optimized workers
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/wasm/*.opt.wasm
            .build/wasm/*.opt.wasm.sha256
          key: wasm-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'packages/**/*.go', 'scripts/mirror/**') }}
          restore-keys: wasm-${{ runner.os }}-shard${{ matrix.shard }}-

      - name: Build this shard's workers
        id: build
        run: scripts/ci/e2e.sh shard ${{ matrix.shard }} 8

      - name: Save optimized workers
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            .build/wasm/*.opt.wasm
            .build/wasm/*.opt.wasm.sha256
          key: wasm-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'packages/**/*.go', 'scripts/mirror/**') }}

      - name: Save Go caches
        if: always() && steps.build.outcome == 'success' && matrix.shard == 0
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-wasm-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: workers-${{ matrix.shard }}
          path: |
            .build/wasm/*.wasm
            .build/wasm/*.sha256
          retention-days: 1
          if-no-files-found: error

  conformance:
    needs: workers
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-linux-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-
            go-linux-${{ runner.os }}-

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install binaryen
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo /opt/binaryen-version_129/bin >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          pattern: workers-*
          path: .build/wasm
          merge-multiple: true

      - name: Build
        id: build
        run: scripts/ci/e2e.sh build

      - name: Start the control plane and a node
        run: scripts/ci/e2e.sh up

      - name: Run the Conformance suite
        run: scripts/ci/e2e.sh test
        env:
          SET: conformance
          FOCUS: ${{ inputs.focus }}

      - name: Summarize the Conformance results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob(".build/e2e/report/conformance/junit.xml"):
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root)
              total = sum(int(s.get("tests", 0)) for s in suites)
              failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) + int(s.get("disabled", 0)) for s in suites)
              print("## Conformance")
              print(f"passed {total - failed - skipped}, failed {failed}, skipped {skipped}, total {total}")
              for case in root.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      print(f"- {case.get('name')}")
          PY

      - name: Save Go caches
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-logs
          path: |
            .build/ci/logs
            .build/e2e/report
          retention-days: 7
          if-no-files-found: ignore
