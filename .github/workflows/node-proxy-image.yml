name: Node proxy image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - packages/node-proxy/**
      - .github/workflows/node-proxy-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-proxy-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/k8flare/node-proxy

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/node-proxy/go.mod
          cache-dependency-path: packages/node-proxy/go.sum

      - name: Test
        working-directory: packages/node-proxy
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/node-proxy
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
