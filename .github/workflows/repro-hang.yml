name: Startup hang repro

on:
  push:
    branches: [diag/startup-hang]

permissions:
  contents: read

concurrency:
  group: repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-wasm-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-wasm-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-
            go-wasm-${{ runner.os }}-

      - name: Install binaryen
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo /opt/binaryen-version_129/bin >> "$GITHUB_PATH"

      - name: Restore optimized workers
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/wasm/*.opt.wasm
            .build/wasm/*.opt.wasm.sha256
          key: wasm-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'packages/**/*.go', 'scripts/mirror/**') }}
          restore-keys: wasm-${{ runner.os }}-shard${{ matrix.shard }}-

      - name: Build this shard's workers
        id: build
        run: scripts/ci/e2e.sh shard ${{ matrix.shard }} 8

      - name: Save optimized workers
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            .build/wasm/*.opt.wasm
            .build/wasm/*.opt.wasm.sha256
          key: wasm-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'packages/**/*.go', 'scripts/mirror/**') }}

      - name: Save Go caches
        if: always() && steps.build.outcome == 'success' && matrix.shard == 0
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-wasm-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: workers-${{ matrix.shard }}
          path: |
            .build/wasm/*.wasm
            .build/wasm/*.sha256
            .build/wasm/*.symbols
          retention-days: 1
          if-no-files-found: error

  repro:
    needs: workers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-linux-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-
            go-linux-${{ runner.os }}-

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install binaryen
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo /opt/binaryen-version_129/bin >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          pattern: workers-*
          path: .build/wasm
          merge-multiple: true

      - name: Build
        id: build
        run: scripts/ci/e2e.sh build

      - name: Install gdb
        run: sudo apt-get install -y -qq gdb >/dev/null

      - name: Start the control plane until it stops answering
        run: scripts/ci/repro.sh

      - name: Save Go caches
        if: always() && steps.build.outcome == 'success' && matrix.runner == 0
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ matrix.runner }}
          path: |
            .build/ci/repro
            .build/wasm/*.symbols
          retention-days: 7
          if-no-files-found: ignore
