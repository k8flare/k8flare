name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript check
        run: vp check

      - name: Build WASM
        run: npm run build:wasm

      - name: Go vet
        run: go vet ./pkg/apiserver/...

      - name: Go test
        run: go test ./pkg/apiserver/...
