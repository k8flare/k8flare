name: CI

# Runs on every pull request so an outside contributor gets a visible
# signal, and on pushes to main. Docs-only changes are skipped to keep
# the Actions quota for changes that can actually break the build; the
# expensive gates (e2e-conformance, cost-gate, smoke-nodes) stay
# workflow_dispatch-only for the same reason -- see CONTRIBUTING.md.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"

      - name: Enable corepack (installed from npm -- runner Node images stopped bundling it, 2026-07)
        run: npm install -g corepack@latest && corepack enable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: pnpm install

      # go.mod's k8s.io/kubernetes and k8s.io/client-go replaces point
      # into gitignored .build/ mirrors, so EVERY go command below --
      # starting with the plain `go mod download` -- fails on a fresh
      # checkout until they exist. The gen scripts self-bootstrap: they
      # resolve the pinned upstream via `go mod download -json
      # module@version`, independent of the replace they're generating
      # (packages/wasm-build/src/gomod.ts). This was broken on every
      # main push since the v2 rearchitecture landed (2026-07-08..10,
      # all runs red in ~30s) -- the e2e workflow never hit it because
      # its first Go-touching step is `npm run build:wasm`, whose make
      # target orders gen-mirrors first.
      - name: Generate .build/ module mirrors (go.mod replace targets)
        run: |
          node packages/wasm-build/src/gen-k8s-js-mirror.ts
          node packages/wasm-build/src/gen-clientgo-lean-mirror.ts

      # cmd/k8flare-gen's OpenAPI generator (cmd/k8flare-gen/openapi.go)
      # reads api/openapi-spec/swagger.json straight off disk from
      # k8s.io/kubernetes's module cache directory (found via `go list -m`)
      # rather than through a normal Go import -- `go list -m` resolves the
      # path without necessarily extracting the module there first, and
      # nothing before this step in this job otherwise builds a package
      # that would force that extraction as a side effect. Without this,
      # the read fails with a bare "no such file or directory" on a fresh
      # runner (caught by actually running this job, not just reading the
      # source -- CLAUDE.md rule 2).
      - name: Download Go modules
        run: go mod download

      - name: Verify generated code is up to date
        run: |
          go run ./cmd/k8flare-gen
          git diff --exit-code -- pkg/apiserver/zz_generated_*.go packages/k8flare-worker/src/k8s/gen packages/k8flare-worker/assets/openapi packages/k8flare-worker/assets/api packages/k8flare-worker/assets/apis || {
            echo "::error::cmd/k8flare-gen output differs from what's committed. Run 'go run ./cmd/k8flare-gen' and commit the result." >&2
            exit 1
          }

      - name: TypeScript check
        run: vp check

      # The former workers/nodes was found (2026-07-03) to be invisible to
      # `vp check`'s type-check pass (root cause in its internal "tsgolint"
      # project discovery, never fully chased). A direct `tsc --noEmit`
      # against the consolidated worker's tsconfig keeps that
      # belt-and-suspenders coverage for the whole merged src tree -- real
      # errors were caught this way that `vp check` missed (a bare
      # `DurableObjectNamespace` return type erasing RPC method types).
      - name: TypeScript check (packages/k8flare-worker, direct tsc)
        run: npx tsc --noEmit -p packages/k8flare-worker/tsconfig.json

      # binaryen's wasm-opt is required by the Makefile's kcm.manifest.json
      # recipe (the KCM WASM only fits under the Worker Loader's hard
      # 64MiB cap after -Oz -- see the Makefile's comment there).
      - name: Install binaryen (wasm-opt) -- pinned release, not apt
        # Pinned to the same version developers use locally (mise
        # aqua:web-assembly/binaryen). apt/ubuntu ships an older binaryen
        # whose -Oz optimizes measurably worse: the SAME source
        # measured 65,204,713 bytes locally (version_129) but 67,222,931
        # bytes (+2.0MB, 111KiB OVER the 64MiB Loader cap) with apt's
        # binaryen on CI -- found 2026-07-10 when the e2e workflow's
        # Build WASM step failed while local builds passed. wasm-opt
        # version is part of the size gate's reproducibility.
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo "/opt/binaryen-version_129/bin" >> "$GITHUB_PATH"

      # Nothing bundles WASM into the script anymore (the old 10MiB-gzip
      # apiserver budget is retired): both control-plane binaries ship as
      # Static Assets chunks and load through the Worker Loader, whose
      # hard 64MiB raw cap is enforced inside the Makefile's wasm targets
      # -- this step fails if either binary exceeds it.
      - name: Build WASM (apiserver + KCM chunks, 64MiB Loader gate inside)
        run: npm run build:wasm

      - name: Go vet
        # `make vet`, not a bare go vet: the documented gate is three passes
        # (host, then GOOS=js with -tags leanwidth and -tags schedwidth). The
        # WASM-target passes are the ones that catch build-tag breakage, and
        # CI was skipping both.
        run: make vet

      # The three lanes `make test` runs, invoked directly rather than
      # through Make: the Makefile target depends on `wasm`, and after a
      # fresh checkout mtimes would make it rebuild everything the
      # build:wasm step above already produced. Keep this list in step
      # with the Makefile's `test` target.
      #
      # The controller lanes are here deliberately. Until 2026-07-31 CI
      # ran only the first one, which disables the controllers -- so the
      # real KCM, GC, scheduler and cluster operator had no automatic
      # gate on any pull request, and the one job that does exercise them
      # (cost-gate.yml) is dispatch-only and cannot be triggered from a
      # fork. They add ~2 minutes.
      - name: Go test (apiserver -- controllers off)
        run: go test ./pkg/apiserver/...

      - name: Go test (real KCM/GC/scheduler dynamic workers)
        run: K8FLARE_KCM_TEST=1 go test -count=1 -run TestKCMDynamicWorkerControlPlane -timeout 15m ./pkg/apiserver/

      - name: Go test (cluster operator lifecycle)
        run: K8FLARE_CLUSTEROP_TEST=1 go test -count=1 -run TestClusterOperatorLifecycle -timeout 15m ./pkg/apiserver/
