name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: pnpm install

      # cmd/k8flare-gen's OpenAPI generator (cmd/k8flare-gen/openapi.go)
      # reads api/openapi-spec/swagger.json straight off disk from
      # k8s.io/kubernetes's module cache directory (found via `go list -m`)
      # rather than through a normal Go import -- `go list -m` resolves the
      # path without necessarily extracting the module there first, and
      # nothing before this step in this job otherwise builds a package
      # that would force that extraction as a side effect. Without this,
      # the read fails with a bare "no such file or directory" on a fresh
      # runner (caught by actually running this job, not just reading the
      # source -- CLAUDE.md rule 2).
      - name: Download Go modules
        run: go mod download

      - name: Verify generated code is up to date
        run: |
          go run ./cmd/k8flare-gen
          git diff --exit-code -- pkg/apiserver/zz_generated_*.go packages/k8s/src/gen workers/apiserver/assets/openapi || {
            echo "::error::cmd/k8flare-gen output differs from what's committed. Run 'go run ./cmd/k8flare-gen' and commit the result." >&2
            exit 1
          }

      - name: TypeScript check
        run: vp check

      # workers/nodes was found (2026-07-03, after merging Phase 7) to be
      # invisible to `vp check`'s type-check pass -- its tsconfig.json is
      # structurally identical to workers/storage's (which IS checked), but
      # `vp check` reports the same file count whether workers/nodes exists
      # or not. Root cause not fully understood (vp check's type-aware pass
      # is powered by an internal "tsgolint" tool -- see
      # node_modules/vite-plus/dist/init-config.js -- whose project
      # discovery this wasn't worth fully reverse-engineering under time
      # pressure); `tsc --noEmit` directly against its tsconfig.json is a
      # direct, verified-working check that doesn't depend on understanding
      # why. Real errors were caught this way that `vp check` missed (a
      # bare `DurableObjectNamespace` return type erasing the RPC method
      # types on the stub it returns).
      - name: TypeScript check (workers/nodes, uncovered by vp check)
        run: npx tsc --noEmit -p workers/nodes/tsconfig.json

      # binaryen's wasm-opt is required by scripts/build-controllers-wasm.sh
      # (workers/controllers' KCM WASM only fits under the Worker Loader's
      # hard 64MiB cap after -Oz -- see the script's header comment).
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build WASM
        run: npm run build:wasm

      # workers/apiserver is the only Worker whose WASM ships inside the
      # script bundle and is therefore bound by Cloudflare's 10MiB gzip
      # deploy cap; the 3 plain-TypeScript Workers (gateway/storage/
      # runtime) are nowhere near it. workers/controllers is NOT gated
      # here because its KCM WASM is not part of the script bundle at all:
      # it ships via Static Assets in <=24MiB chunks and loads through the
      # Worker Loader at runtime (spikes/s14-loader-external-fetch), whose
      # own hard 64MiB raw cap is already enforced inside
      # scripts/build-controllers-wasm.sh (the Build WASM step above fails
      # if it's exceeded).
      - name: Check apiserver WASM gzip size budget
        run: |
          SIZE=$(gzip -c workers/apiserver/build/app.wasm | wc -c)
          LIMIT=9961472 # 9.5 MiB (9.5 * 1024 * 1024). Actual as of Phase 6: ~7.85MB / 78.8% -- see docs/cost-model.md.
          echo "workers/apiserver/build/app.wasm gzip size: $SIZE bytes (limit: $LIMIT bytes / 9.5MiB)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::workers/apiserver/build/app.wasm gzip size ($SIZE bytes) exceeds the 9.5MiB CI budget ($LIMIT bytes). See docs/cost-model.md and docs/platform-verification.md's S8 section for size history and precedent." >&2
            exit 1
          fi

      - name: Go vet
        run: go vet ./pkg/apiserver/...

      - name: Go test
        run: go test ./pkg/apiserver/...
