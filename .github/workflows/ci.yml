name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: pnpm install

      - name: Verify generated code is up to date
        run: |
          go run ./cmd/k8flare-gen
          git diff --exit-code -- pkg/apiserver/zz_generated_*.go packages/k8s/src/gen workers/apiserver/assets/openapi || {
            echo "::error::cmd/k8flare-gen output differs from what's committed. Run 'go run ./cmd/k8flare-gen' and commit the result." >&2
            exit 1
          }

      - name: TypeScript check
        run: vp check

      - name: Build WASM
        run: npm run build:wasm

      - name: Go vet
        run: go vet ./pkg/apiserver/...

      - name: Go test
        run: go test ./pkg/apiserver/...
