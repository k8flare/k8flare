name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: pnpm install

      - name: Verify generated code is up to date
        run: |
          go run ./cmd/k8flare-gen
          git diff --exit-code -- pkg/apiserver/zz_generated_*.go packages/k8s/src/gen workers/apiserver/assets/openapi || {
            echo "::error::cmd/k8flare-gen output differs from what's committed. Run 'go run ./cmd/k8flare-gen' and commit the result." >&2
            exit 1
          }

      - name: TypeScript check
        run: vp check

      - name: Build WASM
        run: npm run build:wasm

      # workers/apiserver is the only Worker with a deploy-time size risk
      # (Go/WASM + client-go-adjacent deps); the other 3 deployable Workers
      # (gateway/storage/runtime) are plain TypeScript, nowhere near
      # Cloudflare's 10MiB gzip limit. workers/controllers is excluded on
      # purpose: it's already known (docs/platform-verification.md's S8
      # section, Phase 5 finding) to be ~19MiB gzip and not deployable at
      # all, kept in-repo as verified-but-undeployable reference code, not
      # part of the release artifact -- gating its size here would just
      # fail CI on a known, already-documented condition.
      - name: Check apiserver WASM gzip size budget
        run: |
          SIZE=$(gzip -c workers/apiserver/build/app.wasm | wc -c)
          LIMIT=9961472 # 9.5 MiB (9.5 * 1024 * 1024). Actual as of Phase 6: ~7.85MB / 78.8% -- see docs/cost-model.md.
          echo "workers/apiserver/build/app.wasm gzip size: $SIZE bytes (limit: $LIMIT bytes / 9.5MiB)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::workers/apiserver/build/app.wasm gzip size ($SIZE bytes) exceeds the 9.5MiB CI budget ($LIMIT bytes). See docs/cost-model.md and docs/platform-verification.md's S8 section for size history and precedent." >&2
            exit 1
          fi

      - name: Go vet
        run: go vet ./pkg/apiserver/...

      - name: Go test
        run: go test ./pkg/apiserver/...
