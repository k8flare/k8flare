name: Unit

on:
  push:
    branches: [main, feat/minimal-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-unit-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-unit-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-
            go-unit-${{ runner.os }}-

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Test the Cluster Durable Object
        run: node --import ./test/register.mjs --test test/*.test.ts
        working-directory: packages/cluster-store

      - name: Test the PodKubelet Durable Object
        run: node --import ./test/register.mjs --test test/*.test.ts src/*_test.ts src/nodes/*_test.ts
        working-directory: packages/control-plane-worker

      - name: Fetch the Kubernetes mirrors
        run: make mirrors

      - name: Install the Node packages
        run: pnpm install --frozen-lockfile

      - name: Check that make gen leaves the tree unchanged
        run: |
          make gen
          git add -A
          git diff --cached --stat --exit-code

      - name: Check that make e2e passes the shard to the runner
        run: make -n e2e SET=required SHARD=1 SHARDS=3 | grep -F -- '-shard 1 -shards 3'

      - name: Test the host packages
        run: |
          go test -count=1 -timeout 20m \
            -skip '^(TestAdmissionExtensions|TestCompaction|TestConfigMapVerbs|TestControllers|TestCustomResources|TestInformerWatchList|TestNodeStreamsOverWebSocket|TestOpenAPI|TestNodePodCIDRAndPodLifecycle|TestRBAC|TestScheduler|TestSchedulerWakesOnNode|TestSupervisorJoin|TestTables|TestWatch|TestWatchSelectorTransitions|TestNodeFieldSelectorDefaults)$' \
            ./packages/...

      - name: Test the scripts module
        run: go test -count=1 ./...
        working-directory: scripts

      - name: Test the node proxy
        run: go test -count=1 ./...
        working-directory: packages/node-proxy

      - name: Test the js/wasm packages
        env:
          GOOS: js
          GOARCH: wasm
        run: go test -count=1 "-exec=env -i PATH=$PATH $(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./packages/worker-bridge ./packages/node-tunnel

      - name: Test that every workloads source lists under js/wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: go test -count=1 "-exec=env -i PATH=$PATH $(go env GOROOT)/lib/wasm/go_js_wasm_exec" -run '^(TestEverySourceCanList|TestValidatingAdmissionPoliciesSource)$' ./packages/workloads

      - name: Save Go caches
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-unit-${{ runner.os }}-${{ hashFiles('go.sum', 'scripts/go.sum') }}-${{ github.sha }}
