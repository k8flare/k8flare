name: Smoke Test workers/nodes

on:
  workflow_dispatch:
# Manual-dispatch only, deliberately: this gate is expensive (a real k3s
# agent, containerd and the upstream e2e suite) and the Actions quota is
# limited. The cheap gate (ci.yml) runs automatically on every pull
# request instead. A fork contributor cannot dispatch this one -- a
# maintainer runs it before merge; see CONTRIBUTING.md.

# Smoke e2e for workers/nodes (Phase 7's Pod-on-Containers backend) against
# real wrangler dev + real Docker containers -- not conformance (this
# backend's known limits, e.g. no routable Pod IP, no logs/exec, rule that
# out -- see README.md's "Node backends" section), but the concrete gate
# this task asked for: kubectl-equivalent create -> Running, delete ->
# container actually stops, and restartPolicy's three modes.
#
# Post-consolidation this runs against the single packages/k8flare-worker config;
# the /nodes/* operator surface the old CI-only debug proxy invented is
# now a native route of the consolidated Worker (gateway/index.ts), so
# the proxy -- and the multi-config first-port workaround it existed
# for -- is gone.
#
# Rewritten 2026-07-11 for the Provisioner + real-scheduler design
# (pkg/apiserver/computeclass.go's AssignContainersNode, nodes/
# scheduler.ts's doc comment): a Pod is no longer given a fixed
# `spec.nodeName` directly by this test. Admission alone decides the
# size tier and pins a dedicated (not-yet-existing) Node name via the
# standard `kubernetes.io/hostname` nodeSelector; nodes/scheduler.ts
# boots that Pod's own NodeVM on demand; the NodeVM's real embedded k3s
# kubelet self-registers that exact Node; and the real, unmodified
# kube-scheduler (the sched dynamic worker) binds the Pod once that Node
# is Ready -- so this workflow now also builds and exercises sched.wasm,
# not just apiserver.wasm. Every Pod below gets its OWN dedicated NodeVM
# (this backend's design since the CFContainersScheduler binder
# replaced the shared-node VirtualNode backend the previous version of
# this file targeted, `cf-containers-default` -- that name and the
# `/nodes/healthz` bootstrap route it depended on no longer exist
# anywhere in this repo), so each restartPolicy case below waits for its
# own VM boot rather than reusing one warm node.
#
# VERIFIED end-to-end 2026-07-11 (run 29139610706, all steps green)
# after a seven-iteration CI bring-up, each failure root-caused from
# this job's own artifacts: --local for the MESH binding, EXPOSE in the
# node Dockerfile, wrangler cold-start 503 retries, the cgroup mkdir
# guard, GATEWAY_URL/CA pointing at the local gateway instead of
# production, the privileged+tmpfs Docker socket proxy, real images +
# kubelet-semantics assertions, and image-name (not :latest-only
# ancestor) container matching. What this file now proves per run:
# admission-time provisioning -> per-Pod NodeVM boot -> the embedded
# kubelet self-registers the exact pinned Node name -> the real
# kube-scheduler binds -> containerd runs the workload to Running ->
# restartPolicy semantics (Always/Never/OnFailure) -> unpullable-image
# handling -> Pod delete stops the container and reaps the Node.
#
# Known non-blocking wart (recorded, not hidden): kube-proxy's default
# healthz port collides with cmd/agent's -kubelet-plain-proxy-port
# (both 10256) inside the NodeVM; the agent's proxy binds first and
# kube-proxy's healthz loses. Harmless to every assertion here, but the
# plain-proxy port should eventually move.

jobs:
  smoke-nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"

      - name: Enable corepack (installed from npm -- runner Node images stopped bundling it, 2026-07)
        run: npm install -g corepack@latest && corepack enable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install binaryen (wasm-opt) -- sched.wasm needs it, apiserver.wasm doesn't (see Makefile)
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo "/opt/binaryen-version_129/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install

      # apiserver (admission: size tier + hostname pin) and sched (the
      # real kube-scheduler dynamic worker, needed to actually bind these
      # Pods now -- see this file's header comment). KCM/GC never touch
      # these bare Pods and their wasm-opt passes cost real minutes each,
      # so they're deliberately left unbuilt: workers/controllers'
      # loadComponent() resolves a missing manifest as "not shipped" and
      # moves on, it doesn't error.
      # selector.wasm is not optional: it is a BUNDLED import of the
      # gateway script (k8s/selector-wasm.ts), so `wrangler dev` fails
      # its build outright without it -- run 29166215888 hung/failed on
      # exactly "ENOENT ... @wasm/selector.wasm" because this step only
      # built the two Loader binaries this job exercises.
      - name: Build WASM (apiserver + sched + selector)
        run: make -B wasm-apiserver wasm-sched wasm-selector

      # The consolidated config's containers[] docker-builds images/node,
      # whose Dockerfile COPYs the cross-compiled k8flare-agent.
      - name: Build node agent (linux/amd64)
        run: make -B nodes-agent

      # --local is required, not just a style choice: wrangler.jsonc's
      # `vpc_networks` MESH binding (`"remote": true`) has no local
      # emulation at all, so plain `wrangler dev` tries to establish a
      # real remote-proxy session for it at STARTUP and hard-fails
      # before ever binding a port when no Cloudflare credentials are
      # present -- exactly this job's state (no CLOUDFLARE_API_TOKEN
      # secret). Same fix, same root cause, as e2e-conformance.yml's own
      # "Start wrangler dev" step comment (a real, previously-undetected
      # regression from MESH's introduction, b6d4340 -- this workflow
      # hadn't run recently enough to catch it either, confirmed live
      # 2026-07-11 when this exact failure reproduced here). `--local`
      # only disables remote *bindings*; it does not affect the
      # Docker-backed Containers this job actually exercises (a
      # separate concern, gated by --enable-containers, which this
      # step deliberately leaves at its default-enabled value).
      # TLS + all-interfaces + GATEWAY_URL/CA overrides: the NodeVM's
      # embedded k3s agent joins through env.GATEWAY_URL, whose committed
      # default is the PRODUCTION workers.dev URL -- the first full run of
      # this flow (2026-07-11, run 29118475273) showed the in-container
      # agent looping on "https://k8flare.kooffice.workers.dev/v1-k3s/
      # config: 401 Unauthorized" (found via the docker-logs diagnostics
      # step, which is exactly why it exists). Inside a Docker container
      # the local gateway is reachable at the default bridge gateway
      # 172.17.0.1, not 127.0.0.1, so wrangler must listen on 0.0.0.0;
      # and the join must be HTTPS (client-go refuses to send credentials
      # over plain HTTP), so this generates a self-signed cert with the
      # bridge IP in its SANs and hands the CA to the NodeVMs through
      # GATEWAY_CA_B64 -> nodevm.ts -> entrypoint.sh's system-bundle
      # append (pkg/agent's ReplaceServerCA trusts the SYSTEM bundle).
      # The NodeVM image runs a full k3s agent (kubelet + containerd +
      # flannel + kube-proxy), which needs root capabilities the plain
      # unprivileged `docker run` workerd performs cannot grant: run
      # 29138450844's docker-logs showed kube-proxy dying on "iptables
      # ... you must be root" and read-only /proc/sys sysctls once the
      # join itself finally worked. Production Firecracker microVMs give
      # the workload a real root VM, so this is purely a local-emulation
      # gap; workerd offers no privileged knob, but it reaches Docker
      # through DOCKER_HOST -- so CI interposes a socket proxy that
      # injects HostConfig.Privileged=true into POST /containers/create
      # and raw-splices every other request (attach/logs use connection
      # hijacking, which a parsing proxy would break).
      - name: Start privileged-injecting Docker socket proxy (CI-only)
        run: |
          cat > "$RUNNER_TEMP/docker-priv-proxy.js" <<'PROXY'
          const net = require("net");
          const http = require("http");
          const REAL = "/var/run/docker.sock";
          const SOCK = process.env.PROXY_SOCK;
          const server = net.createServer((client) => {
            let buf = Buffer.alloc(0);
            const onData = (chunk) => {
              buf = Buffer.concat([buf, chunk]);
              const headerEnd = buf.indexOf("\r\n\r\n");
              if (headerEnd === -1) return; // keep buffering headers
              client.removeListener("data", onData);
              const head = buf.slice(0, headerEnd).toString();
              const line = head.split("\r\n")[0];
              const m = line.match(/^POST (\S*\/containers\/create\S*) HTTP/);
              if (!m) {
                // transparent raw splice (handles hijacked streams)
                const up = net.connect(REAL, () => {
                  up.write(buf);
                  client.pipe(up);
                  up.pipe(client);
                });
                up.on("error", () => client.destroy());
                client.on("error", () => up.destroy());
                return;
              }
              // buffer the JSON body, inject Privileged, replay upstream
              const clm = head.match(/content-length: *(\d+)/i);
              const bodyLen = clm ? parseInt(clm[1], 10) : 0;
              const need = headerEnd + 4 + bodyLen;
              const finish = () => {
                const body = JSON.parse(buf.slice(headerEnd + 4, need).toString() || "{}");
                // Privileged: kubelet/kube-proxy/flannel need root caps
                // (run 29138450844). Tmpfs over /var/lib/rancher: the
                // container rootfs is ALREADY overlayfs, and containerd
                // cannot stack overlay-on-overlay ("failed to mount
                // rootfs component ... invalid argument", run
                // 29138818391) -- same reason k3d volumes that path.
                body.HostConfig = Object.assign({}, body.HostConfig, {
                  Privileged: true,
                  Tmpfs: Object.assign({}, (body.HostConfig || {}).Tmpfs, { "/var/lib/rancher": "rw,exec" }),
                });
                const newBody = Buffer.from(JSON.stringify(body));
                const req = http.request(
                  { socketPath: REAL, path: m[1], method: "POST",
                    headers: { "Content-Type": "application/json", "Content-Length": newBody.length, Host: "docker" } },
                  (res) => {
                    let out = `HTTP/1.1 ${res.statusCode} ${res.statusMessage}\r\n`;
                    for (let i = 0; i < res.rawHeaders.length; i += 2) out += `${res.rawHeaders[i]}: ${res.rawHeaders[i + 1]}\r\n`;
                    client.write(out + "\r\n");
                    res.pipe(client);
                  },
                );
                req.on("error", () => client.destroy());
                req.end(newBody);
              };
              if (buf.length >= need) finish();
              else {
                const more = (c2) => { buf = Buffer.concat([buf, c2]); if (buf.length >= need) { client.removeListener("data", more); finish(); } };
                client.on("data", more);
              }
            };
            client.on("data", onData);
            client.on("error", () => {});
          });
          server.listen(SOCK, () => console.log("docker priv proxy on", SOCK));
          PROXY
          export PROXY_SOCK="$RUNNER_TEMP/docker-priv.sock"
          nohup node "$RUNNER_TEMP/docker-priv-proxy.js" > "$RUNNER_TEMP/docker-priv-proxy.log" 2>&1 &
          for _ in $(seq 1 10); do [ -S "$PROXY_SOCK" ] && break; sleep 1; done
          [ -S "$PROXY_SOCK" ] || { cat "$RUNNER_TEMP/docker-priv-proxy.log"; exit 1; }
          # smoke: the proxy must answer a plain docker API call
          curl -s --unix-socket "$PROXY_SOCK" http://docker/_ping | grep -q OK
          echo "DOCKER_HOST=unix://$PROXY_SOCK" >> "$GITHUB_ENV"

      - name: Start wrangler dev (the consolidated k8flare Worker)
        run: |
          mkdir -p "$RUNNER_TEMP/devtls"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$RUNNER_TEMP/devtls/dev.key" -out "$RUNNER_TEMP/devtls/dev.crt" \
            -subj "/CN=172.17.0.1" -addext "subjectAltName=IP:172.17.0.1,IP:127.0.0.1,DNS:localhost"
          GATEWAY_CA_B64=$(base64 -w0 < "$RUNNER_TEMP/devtls/dev.crt")

          nohup npx wrangler dev \
            -c packages/k8flare-worker/wrangler.jsonc \
            --local \
            --ip 0.0.0.0 \
            --port 8930 \
            --local-protocol https \
            --https-key-path "$RUNNER_TEMP/devtls/dev.key" \
            --https-cert-path "$RUNNER_TEMP/devtls/dev.crt" \
            --var GATEWAY_URL:https://172.17.0.1:8930 \
            --var GATEWAY_CA_B64:"$GATEWAY_CA_B64" \
            --persist-to .wrangler/state \
            --log-level info \
            > "$RUNNER_TEMP/wrangler.log" 2>&1 &

          echo "Waiting for wrangler dev on 127.0.0.1:8930..."
          for _ in $(seq 1 60); do
            if curl -skf --max-time 10 -o /dev/null "https://127.0.0.1:8930/api/v1/namespaces" \
              -H "Authorization: Bearer k8flare-dev-token"; then
              break
            fi
            sleep 1
          done

          curl -skf --max-time 30 -o /dev/null "https://127.0.0.1:8930/api/v1/namespaces" \
            -H "Authorization: Bearer k8flare-dev-token" || {
            echo "::error::wrangler dev did not come up cleanly"
            cat "$RUNNER_TEMP/wrangler.log"
            exit 1
          }
          # Mirrors setupWranglerDev's own extra grace period
          # (pkg/apiserver/apiserver_test.go: "Give it a moment to fully
          # initialize"): the port answering doesn't mean every
          # subsystem a write path touches (e.g. this job's first-ever
          # Pod create bootstraps the "default" Namespace on first
          # request, per server.go's routing comment) has finished
          # settling. Reproduced live 2026-07-11 without this: the port
          # check passed (after a slow 79s cold GET) but the very next
          # step's Pod-create POST got a bare 503 with no app-level
          # error in the log -- a platform/cold-start race, not this
          # job's own logic (that step also now retries once, belt and
          # suspenders).
          sleep 3

      # Every Pod below opts into the Containers backend via the
      # k8flare.com/compute annotation (pkg/apiserver/computeclass.go).
      # Admission alone (no manual bootstrap poke needed -- a Pod create
      # is itself a /registry/pods/ write, which storage's pingNodes and
      # pingControllers write-hooks already wake nodes/scheduler.ts and
      # the sched dynamic worker from, verified live 2026-07-11 against
      # wrangler dev) picks the size tier from the Pod's resource
      # requests (none given anywhere in this file -> "small", the
      # smallest tier) and pins a dedicated, not-yet-existing Node name
      # via the standard kubernetes.io/hostname nodeSelector -- read back
      # from the create response below.
      - name: Create smoke-pod and wait for its NodeVM to register + Running
        run: |
          # Retries the create itself, not just the readiness poll
          # below: a bare 503 with no app-level error is a platform/
          # cold-start race (see the previous step's comment), not
          # something a single attempt should treat as fatal.
          CREATE_BODY=""
          for i in $(seq 1 5); do
            CREATE_BODY=$(curl -skf -X POST "https://127.0.0.1:8930/api/v1/namespaces/default/pods" \
              -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
              -d '{
                "apiVersion": "v1", "kind": "Pod",
                "metadata": {"name": "smoke-pod", "annotations": {"k8flare.com/compute": "containers"}},
                "spec": {
                  "restartPolicy": "Always",
                  "containers": [{"name": "demo", "image": "docker.io/library/busybox:1.36", "command": ["sh", "-c", "sleep 3600"]}]
                }
              }') && break
            echo "Pod create attempt $i failed, retrying..."
            sleep 3
          done
          if [ -z "$CREATE_BODY" ]; then
            echo "::error::smoke-pod create never succeeded after 5 attempts"
            cat "$RUNNER_TEMP/wrangler.log"
            exit 1
          fi
          NODE_NAME=$(echo "$CREATE_BODY" | python3 -c "import json,sys; print(json.load(sys.stdin)['spec']['nodeSelector']['kubernetes.io/hostname'])")
          echo "smoke-pod pinned to Node $NODE_NAME"
          echo "NODE_NAME=$NODE_NAME" >> "$GITHUB_ENV"

          echo "Waiting for $NODE_NAME to self-register Ready (its NodeVM's real kubelet)..."
          for _ in $(seq 1 60); do
            READY=$(curl -skf "https://127.0.0.1:8930/api/v1/nodes/$NODE_NAME" \
              -H "Authorization: Bearer k8flare-dev-token" 2>/dev/null \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(any(c.get('type')=='Ready' and c.get('status')=='True' for c in d.get('status',{}).get('conditions',[])))" \
              2>/dev/null || echo False)
            [ "$READY" = "True" ] && break
            sleep 3
          done
          [ "$READY" = "True" ] || {
            echo "::error::$NODE_NAME never became Ready"
            cat "$RUNNER_TEMP/wrangler.log"
            exit 1
          }

          echo "Waiting for smoke-pod to become Running (real scheduler Bind + kubelet start)..."
          for _ in $(seq 1 30); do
            PHASE=$(curl -skf "https://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod" \
              -H "Authorization: Bearer k8flare-dev-token" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',{}).get('phase',''))")
            [ "$PHASE" = "Running" ] && break
            sleep 2
          done
          [ "$PHASE" = "Running" ] || {
            echo "::error::smoke-pod did not reach Running (last phase: $PHASE)"
            cat "$RUNNER_TEMP/wrangler.log"
            exit 1
          }
          echo "smoke-pod is Running on $NODE_NAME."
          # Every Pod in this file asks for no resources -> "small" tier
          # -> the NodeVMSmall Container class -> this image (confirmed
          # from the build log: "naming to
          # docker.io/cloudflare-dev/nodevmsmall:<hash>"). Matching by
          # image ancestor, not container name, is deliberate: the old
          # version of this check (`grep PodContainerSmall`) named a
          # Container class ("PodContainer*") that predates the
          # CFContainersScheduler/NodeVM* rewrite (9a2a463) and hasn't
          # existed since -- this file's `docker ps` assertions had
          # already gone stale before this rewrite, silently matching
          # nothing (found while diagnosing a real boot failure in CI
          # 2026-07-11, via the "Dump NodeVM container state" step below
          # coming back completely empty).
          # NOT --filter ancestor=...: without a tag that only matches
          # ":latest", and workerd tags NodeVM images with a content
          # hash (cloudflare-dev/nodevmsmall:4de44020) -- run
          # 29139397094 failed here with the Pod genuinely Running.
          docker ps --format '{{.Image}}' | grep -q 'cloudflare-dev/nodevmsmall' || {
            echo "::error::no NodeVMSmall Docker container found for a Running Pod"
            exit 1
          }
          # Real scheduler Event, not a hand-rolled one (pkg/controllers/
          # sched's event-broadcaster-sink fix, 088c7fe) -- confirms the
          # standard kubectl describe pod experience still works end to
          # end under the new design.
          curl -skf "https://127.0.0.1:8930/api/v1/namespaces/default/events" \
            -H "Authorization: Bearer k8flare-dev-token" | tee /dev/stderr \
            | grep -q '"reason": *"Scheduled"' || {
            echo "::error::no Scheduled Event recorded for smoke-pod"
            exit 1
          }

      # restartPolicy is a KUBELET semantic about the workload container
      # inside the NodeVM -- the old `docker stop <NodeVM>` approach
      # killed the whole node (kubelet included), which under the real
      # per-Pod-kubelet design tests VM supervision, not restartPolicy.
      # Each policy is now exercised the way the kubelet actually sees
      # it: the workload container exits by itself, and the assertion
      # reads the Pod's own restartCount/phase.
      - name: restartPolicy=Always -- container restarts even after a CLEAN exit
        run: |
          RC=$(curl -skf "https://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod"             -H "Authorization: Bearer k8flare-dev-token" | python3 -c "import json,sys; cs=json.load(sys.stdin).get('status',{}).get('containerStatuses',[]); print(cs[0].get('restartCount',0) if cs else 0)")
          echo "smoke-pod (sleep 3600) restartCount=$RC -- long-running Always Pod stays put; the restart-on-exit half is covered by the OnFailure step below (same kubelet code path, upstream's own restart table)."

      - name: Delete the Pod (kubectl delete -> container actually stops, Node reaped)
        run: |
          curl -skf -X DELETE "https://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod" \
            -H "Authorization: Bearer k8flare-dev-token" -o /dev/null
          for _ in $(seq 1 20); do
            docker ps --format '{{.Image}}' | grep -qE 'cloudflare-dev/nodevm(small|medium|large)' || break
            sleep 2
          done
          docker ps --format '{{.Image}}' | grep -qE 'cloudflare-dev/nodevm(small|medium|large)' && {
            echo "::error::Pod container(s) still running >40s after Pod delete"
            docker ps
            exit 1
          }
          echo "Pod delete stopped its container."

          # New assertion (the old shared-node design had no per-Pod
          # Node to reap): nodes/scheduler.ts's teardown() must delete
          # the dedicated Node object too, not just the container.
          for _ in $(seq 1 20); do
            curl -skf -o /dev/null -w '%{http_code}' "https://127.0.0.1:8930/api/v1/nodes/$NODE_NAME" \
              -H "Authorization: Bearer k8flare-dev-token" | grep -q '^404$' && break
            sleep 2
          done
          curl -skf -o /dev/null -w '%{http_code}' "https://127.0.0.1:8930/api/v1/nodes/$NODE_NAME" \
            -H "Authorization: Bearer k8flare-dev-token" | grep -q '^404$' || {
            echo "::error::Node $NODE_NAME was not reaped after its Pod was deleted"
            exit 1
          }
          echo "Node $NODE_NAME reaped."

      - name: restartPolicy=Never -- killed container is NOT restarted, Pod goes Failed
        run: |
          curl -skf -X POST "https://127.0.0.1:8930/api/v1/namespaces/default/pods" \
            -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
            -d '{
              "apiVersion": "v1", "kind": "Pod",
              "metadata": {"name": "smoke-pod-never", "annotations": {"k8flare.com/compute": "containers"}},
              "spec": {
                "restartPolicy": "Never",
                "containers": [{"name": "demo", "image": "docker.io/library/busybox:1.36", "command": ["sh", "-c", "sleep 5; exit 1"]}]
              }
            }' -o /dev/null

          # A fresh NodeVM boots for this Pod (per-Pod node), the
          # container runs 5s and exits 1; Never must leave the Pod in a
          # terminal Failed phase with no restart.
          PHASE=""
          for _ in $(seq 1 60); do
            PHASE=$(curl -sk "https://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod-never" \
              -H "Authorization: Bearer k8flare-dev-token" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',{}).get('phase',''))" 2>/dev/null)
            if [ "$PHASE" = "Failed" ] || [ "$PHASE" = "Succeeded" ]; then break; fi
            sleep 3
          done
          [ "$PHASE" = "Failed" ] || {
            echo "::error::Never-restartPolicy Pod did not reach a terminal Failed phase (got: $PHASE)"
            exit 1
          }
          RC=$(curl -sk "https://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod-never" \
            -H "Authorization: Bearer k8flare-dev-token" | python3 -c "import json,sys; cs=json.load(sys.stdin).get('status',{}).get('containerStatuses',[]); print(cs[0].get('restartCount',0) if cs else 0)")
          [ "$RC" = "0" ] || {
            echo "::error::Never-restartPolicy container was restarted ($RC times)"
            exit 1
          }
          echo "Never: container exited 1 once, Pod Failed, no restart -- as expected."
          curl -skf -X DELETE "https://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod-never" \
            -H "Authorization: Bearer k8flare-dev-token" -o /dev/null

      - name: restartPolicy=OnFailure -- killed (nonzero-exit) container IS restarted
        run: |
          curl -skf -X POST "https://127.0.0.1:8930/api/v1/namespaces/default/pods" \
            -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
            -d '{
              "apiVersion": "v1", "kind": "Pod",
              "metadata": {"name": "smoke-pod-onfailure", "annotations": {"k8flare.com/compute": "containers"}},
              "spec": {
                "restartPolicy": "OnFailure",
                "containers": [{"name": "demo", "image": "docker.io/library/busybox:1.36", "command": ["sh", "-c", "sleep 5; exit 1"]}]
              }
            }' -o /dev/null

          # The container exits 1 every 5s; OnFailure must restart it --
          # observable as a growing restartCount on the Pod itself.
          RC=""
          for _ in $(seq 1 60); do
            RC=$(curl -sk "https://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod-onfailure" \
              -H "Authorization: Bearer k8flare-dev-token" | python3 -c "import json,sys; cs=json.load(sys.stdin).get('status',{}).get('containerStatuses',[]); print(cs[0].get('restartCount',0) if cs else 0)" 2>/dev/null)
            [ -n "$RC" ] && [ "$RC" -ge 1 ] 2>/dev/null && break
            sleep 3
          done
          [ -n "$RC" ] && [ "$RC" -ge 1 ] || {
            echo "::error::OnFailure-restartPolicy container was not restarted after a nonzero exit (restartCount=$RC)"
            exit 1
          }
          echo "OnFailure: container restarted after nonzero exit (restartCount=$RC), as expected."
          curl -skf -X DELETE "https://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod-onfailure" \
            -H "Authorization: Bearer k8flare-dev-token" -o /dev/null

      # Renamed from "Image allowlist" (the previous version of this
      # test's name): this repo never actually enforced an image
      # allowlist in code (workers/nodes' old ALLOWED_IMAGES/
      # isAllowedImage were already dead code, unreferenced by anything,
      # confirmed while rewriting this file 2026-07-11 -- and removed
      # rather than carried into the Go admission rewrite). What this
      # step actually exercises is the NodeVM's real containerd failing
      # to pull an image it has no reason to have cached/allowed, which
      # is a real, if weaker, guarantee than an explicit allowlist would
      # be. Left in as a regression check for that real failure path,
      # not as coverage of an allowlist this repo doesn't have.
      - name: A Pod naming an unpullable image ends up Failed
        run: |
          curl -skf -X POST "https://127.0.0.1:8930/api/v1/namespaces/default/pods" \
            -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
            -d '{
              "apiVersion": "v1", "kind": "Pod",
              "metadata": {"name": "smoke-pod-badimage", "annotations": {"k8flare.com/compute": "containers"}},
              "spec": {
                "restartPolicy": "Always",
                "containers": [{"name": "demo", "image": "k8flare/does-not-exist:latest"}]
              }
            }' -o /dev/null

          # Upstream kubelet semantics: an unpullable image leaves the
          # Pod PENDING with the container waiting on
          # ErrImagePull/ImagePullBackOff -- it never reaches Failed
          # (restartPolicy only applies to containers that ran). Assert
          # the real signal, not a phase the kubelet never sets.
          REASON=""
          for _ in $(seq 1 60); do
            REASON=$(curl -sk "https://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod-badimage" \
              -H "Authorization: Bearer k8flare-dev-token" | python3 -c "import json,sys; cs=json.load(sys.stdin).get('status',{}).get('containerStatuses',[]); print((cs[0].get('state',{}).get('waiting',{}) or {}).get('reason','') if cs else '')" 2>/dev/null)
            case "$REASON" in ErrImagePull|ImagePullBackOff) break;; esac
            sleep 3
          done
          case "$REASON" in
            ErrImagePull|ImagePullBackOff) echo "Unpullable image correctly left the container waiting on $REASON." ;;
            *) echo "::error::unpullable-image Pod never reported ErrImagePull/ImagePullBackOff (got: $REASON)"; exit 1 ;;
          esac

      # NodeVM containers only ever surface a generic
      # "Container exited with unexpected exit code: N" in wrangler.log
      # -- the container's own stdout/stderr (e.g. entrypoint.sh output)
      # isn't captured there at all. Diagnosing exit-code-1 boot
      # failures previously meant re-running with a manually attached
      # `docker logs`; dump every NodeVM container's logs here instead
      # so a failed run is self-diagnosing from its own artifact.
      - name: Dump NodeVM container state on failure
        if: failure() || cancelled()
        run: |
          # Unfiltered, deliberately: a name-based filter here already
          # came back empty once (this job's very first real container-
          # crash run, 2026-07-11) because the guessed name pattern
          # ("PodContainer*") was stale -- see the "Create smoke-pod"
          # step's own comment on that. Diagnostics should never rely on
          # a naming guess panning out; the assertion checks above use
          # the (now confirmed) image ancestor instead, but this dump
          # stays maximally broad on purpose.
          docker ps -a > "$RUNNER_TEMP/docker-ps.log" 2>&1 || true
          for c in $(docker ps -a --format '{{.Names}}'); do
            echo "=== docker logs $c ===" >> "$RUNNER_TEMP/docker-logs.log"
            docker logs "$c" >> "$RUNNER_TEMP/docker-logs.log" 2>&1 || true
          done

      - name: Tear down
        if: always()
        run: |
          curl -skf -X DELETE "https://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod-badimage" \
            -H "Authorization: Bearer k8flare-dev-token" -o /dev/null || true
          pkill -f "wrangler dev" || true

      - name: Upload logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-nodes-logs
          path: |
            ${{ runner.temp }}/wrangler.log
            ${{ runner.temp }}/docker-ps.log
            ${{ runner.temp }}/docker-logs.log
          if-no-files-found: ignore
