# Smoke e2e for workers/nodes (Phase 7's Pod-on-Containers backend) against
# real wrangler dev + real Docker containers -- not conformance (this
# backend's known limits, e.g. no routable Pod IP, no logs/exec, rule that
# out -- see README.md's "Node backends" section), but the concrete gate
# this task asked for: kubectl-equivalent create -> Running, delete ->
# container actually stops, and restartPolicy's three modes.
#
# Post-consolidation this runs against the single workers/k8flare config;
# the /nodes/* operator surface the old CI-only debug proxy invented is
# now a native route of the consolidated Worker (gateway/index.ts), so
# the proxy -- and the multi-config first-port workaround it existed
# for -- is gone.
#
# Rewritten 2026-07-11 for the Provisioner + real-scheduler design
# (pkg/apiserver/computeclass.go's AssignContainersNode, nodes/
# scheduler.ts's doc comment): a Pod is no longer given a fixed
# `spec.nodeName` directly by this test. Admission alone decides the
# size tier and pins a dedicated (not-yet-existing) Node name via the
# standard `kubernetes.io/hostname` nodeSelector; nodes/scheduler.ts
# boots that Pod's own NodeVM on demand; the NodeVM's real embedded k3s
# kubelet self-registers that exact Node; and the real, unmodified
# kube-scheduler (the sched dynamic worker) binds the Pod once that Node
# is Ready -- so this workflow now also builds and exercises sched.wasm,
# not just apiserver.wasm. Every Pod below gets its OWN dedicated NodeVM
# (this backend's design since the CFContainersScheduler binder
# replaced the shared-node VirtualNode backend the previous version of
# this file targeted, `cf-containers-default` -- that name and the
# `/nodes/healthz` bootstrap route it depended on no longer exist
# anywhere in this repo), so each restartPolicy case below waits for its
# own VM boot rather than reusing one warm node.
#
# CAUTION -- unverified end-to-end: this rewrite could only be checked
# against the admission (Go, tier/nodeSelector/annotation mutation) and
# real-scheduler (Unschedulable-while-no-Node, real Binding once Ready)
# halves locally, via `wrangler dev --enable-containers=false` (no
# Docker in this sandbox, CLAUDE.md's documented constraint). The
# Docker-dependent halves -- the NodeVM's real kubelet actually
# self-registering the exact pinned Node name, and every `docker ps`
# assertion below -- have NOT been run since this rewrite. Watch the
# first CI run closely and be ready to adjust step names is what this
# actually observes (a Docker-dependent watch, not a "verified working"
# claim) and reconsider the timeout-minutes budget below: per-Pod VM
# boot (4 separate NodeVMs across this file, vs. 1 shared node before)
# is expected to take noticeably longer in wall-clock time than the
# previous version of this file did.
name: Smoke Test workers/nodes

on:
  pull_request:
    paths:
      - "workers/k8flare/**"
      - "pkg/apiserver/nodecidr.go"
      - "pkg/apiserver/computeclass.go"
      - "pkg/controllers/sched/**"
  workflow_dispatch:

jobs:
  smoke-nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"

      - name: Enable corepack (installed from npm -- runner Node images stopped bundling it, 2026-07)
        run: npm install -g corepack@latest && corepack enable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install binaryen (wasm-opt) -- sched.wasm needs it, apiserver.wasm doesn't (see Makefile)
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo "/opt/binaryen-version_129/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install

      # apiserver (admission: size tier + hostname pin) and sched (the
      # real kube-scheduler dynamic worker, needed to actually bind these
      # Pods now -- see this file's header comment). KCM/GC never touch
      # these bare Pods and their wasm-opt passes cost real minutes each,
      # so they're deliberately left unbuilt: workers/controllers'
      # loadComponent() resolves a missing manifest as "not shipped" and
      # moves on, it doesn't error.
      - name: Build WASM (apiserver + sched)
        run: make -B wasm-apiserver wasm-sched

      # The consolidated config's containers[] docker-builds images/node,
      # whose Dockerfile COPYs the cross-compiled k8flare-agent.
      - name: Build node agent (linux/amd64)
        run: make -B nodes-agent

      - name: Start wrangler dev (the consolidated k8flare Worker)
        run: |
          nohup npx wrangler dev \
            -c workers/k8flare/wrangler.jsonc \
            --port 8930 \
            --persist-to .wrangler/state \
            --log-level info \
            > "$RUNNER_TEMP/wrangler.log" 2>&1 &

          echo "Waiting for wrangler dev on 127.0.0.1:8930..."
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:8930/api/v1/namespaces" \
              -H "Authorization: Bearer k8flare-dev-token"; then
              break
            fi
            sleep 1
          done

          curl -skf -o /dev/null "http://127.0.0.1:8930/api/v1/namespaces" \
            -H "Authorization: Bearer k8flare-dev-token" || {
            echo "::error::wrangler dev did not come up cleanly"
            cat "$RUNNER_TEMP/wrangler.log"
            exit 1
          }

      # Every Pod below opts into the Containers backend via the
      # k8flare.com/compute annotation (pkg/apiserver/computeclass.go).
      # Admission alone (no manual bootstrap poke needed -- a Pod create
      # is itself a /registry/pods/ write, which storage's pingNodes and
      # pingControllers write-hooks already wake nodes/scheduler.ts and
      # the sched dynamic worker from, verified live 2026-07-11 against
      # wrangler dev) picks the size tier from the Pod's resource
      # requests (none given anywhere in this file -> "small", the
      # smallest tier) and pins a dedicated, not-yet-existing Node name
      # via the standard kubernetes.io/hostname nodeSelector -- read back
      # from the create response below.
      - name: Create smoke-pod and wait for its NodeVM to register + Running
        run: |
          NODE_NAME=$(curl -sf -X POST "http://127.0.0.1:8930/api/v1/namespaces/default/pods" \
            -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
            -d '{
              "apiVersion": "v1", "kind": "Pod",
              "metadata": {"name": "smoke-pod", "annotations": {"k8flare.com/compute": "containers"}},
              "spec": {
                "restartPolicy": "Always",
                "containers": [{"name": "demo", "image": "k8flare/demo:latest"}]
              }
            }' | python3 -c "import json,sys; print(json.load(sys.stdin)['spec']['nodeSelector']['kubernetes.io/hostname'])")
          echo "smoke-pod pinned to Node $NODE_NAME"
          echo "NODE_NAME=$NODE_NAME" >> "$GITHUB_ENV"

          echo "Waiting for $NODE_NAME to self-register Ready (its NodeVM's real kubelet)..."
          for _ in $(seq 1 60); do
            READY=$(curl -sf "http://127.0.0.1:8930/api/v1/nodes/$NODE_NAME" \
              -H "Authorization: Bearer k8flare-dev-token" 2>/dev/null \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(any(c.get('type')=='Ready' and c.get('status')=='True' for c in d.get('status',{}).get('conditions',[])))" \
              2>/dev/null || echo False)
            [ "$READY" = "True" ] && break
            sleep 3
          done
          [ "$READY" = "True" ] || {
            echo "::error::$NODE_NAME never became Ready"
            cat "$RUNNER_TEMP/wrangler.log"
            exit 1
          }

          echo "Waiting for smoke-pod to become Running (real scheduler Bind + kubelet start)..."
          for _ in $(seq 1 30); do
            PHASE=$(curl -sf "http://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod" \
              -H "Authorization: Bearer k8flare-dev-token" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',{}).get('phase',''))")
            [ "$PHASE" = "Running" ] && break
            sleep 2
          done
          [ "$PHASE" = "Running" ] || {
            echo "::error::smoke-pod did not reach Running (last phase: $PHASE)"
            cat "$RUNNER_TEMP/wrangler.log"
            exit 1
          }
          echo "smoke-pod is Running on $NODE_NAME."
          docker ps --format '{{.Names}}' | grep -q PodContainer || {
            echo "::error::no PodContainer* Docker container found for a Running Pod"
            exit 1
          }
          # Real scheduler Event, not a hand-rolled one (pkg/controllers/
          # sched's event-broadcaster-sink fix, 088c7fe) -- confirms the
          # standard kubectl describe pod experience still works end to
          # end under the new design.
          curl -sf "http://127.0.0.1:8930/api/v1/namespaces/default/events" \
            -H "Authorization: Bearer k8flare-dev-token" | tee /dev/stderr \
            | grep -q '"reason": *"Scheduled"' || {
            echo "::error::no Scheduled Event recorded for smoke-pod"
            exit 1
          }

      - name: restartPolicy=Always -- container is restarted after being killed
        run: |
          CID=$(docker ps --format '{{.Names}}' | grep PodContainerSmall | grep -v -- -proxy | head -1)
          docker stop "$CID"
          for _ in $(seq 1 20); do
            docker ps --format '{{.Names}}' | grep -qx "$CID" && break
            sleep 2
          done
          docker ps --format '{{.Names}}' | grep -qx "$CID" || {
            echo "::error::Always-restartPolicy container was not restarted after being stopped"
            exit 1
          }
          echo "Always: container restarted as expected."

      - name: Delete the Pod (kubectl delete -> container actually stops, Node reaped)
        run: |
          curl -sf -X DELETE "http://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod" \
            -H "Authorization: Bearer k8flare-dev-token" -o /dev/null
          for _ in $(seq 1 20); do
            docker ps --format '{{.Names}}' | grep -q PodContainer || break
            sleep 2
          done
          docker ps --format '{{.Names}}' | grep -q PodContainer && {
            echo "::error::Pod container(s) still running >40s after Pod delete"
            docker ps
            exit 1
          }
          echo "Pod delete stopped its container."

          # New assertion (the old shared-node design had no per-Pod
          # Node to reap): nodes/scheduler.ts's teardown() must delete
          # the dedicated Node object too, not just the container.
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null -w '%{http_code}' "http://127.0.0.1:8930/api/v1/nodes/$NODE_NAME" \
              -H "Authorization: Bearer k8flare-dev-token" | grep -q '^404$' && break
            sleep 2
          done
          curl -sf -o /dev/null -w '%{http_code}' "http://127.0.0.1:8930/api/v1/nodes/$NODE_NAME" \
            -H "Authorization: Bearer k8flare-dev-token" | grep -q '^404$' || {
            echo "::error::Node $NODE_NAME was not reaped after its Pod was deleted"
            exit 1
          }
          echo "Node $NODE_NAME reaped."

      - name: restartPolicy=Never -- killed container is NOT restarted, Pod goes Failed
        run: |
          curl -sf -X POST "http://127.0.0.1:8930/api/v1/namespaces/default/pods" \
            -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
            -d '{
              "apiVersion": "v1", "kind": "Pod",
              "metadata": {"name": "smoke-pod-never", "annotations": {"k8flare.com/compute": "containers"}},
              "spec": {
                "restartPolicy": "Never",
                "containers": [{"name": "demo", "image": "k8flare/demo:latest"}]
              }
            }' -o /dev/null

          for _ in $(seq 1 30); do
            docker ps --format '{{.Names}}' | grep -q PodContainerSmall && break
            sleep 3
          done
          CID=$(docker ps --format '{{.Names}}' | grep PodContainerSmall | grep -v -- -proxy | head -1)
          [ -n "$CID" ] || { echo "::error::smoke-pod-never's container never started"; exit 1; }
          docker stop "$CID"

          for _ in $(seq 1 20); do
            PHASE=$(curl -sf "http://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod-never" \
              -H "Authorization: Bearer k8flare-dev-token" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',{}).get('phase',''))")
            if [ "$PHASE" = "Failed" ] || [ "$PHASE" = "Succeeded" ]; then break; fi
            sleep 2
          done
          [ "$PHASE" = "Failed" ] || {
            echo "::error::Never-restartPolicy Pod did not reach a terminal Failed phase (got: $PHASE)"
            exit 1
          }
          docker ps --format '{{.Names}}' | grep -qx "$CID" && {
            echo "::error::Never-restartPolicy container was restarted after being stopped"
            exit 1
          }
          echo "Never: container left stopped, Pod marked Failed, as expected."
          curl -sf -X DELETE "http://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod-never" \
            -H "Authorization: Bearer k8flare-dev-token" -o /dev/null

      - name: restartPolicy=OnFailure -- killed (nonzero-exit) container IS restarted
        run: |
          curl -sf -X POST "http://127.0.0.1:8930/api/v1/namespaces/default/pods" \
            -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
            -d '{
              "apiVersion": "v1", "kind": "Pod",
              "metadata": {"name": "smoke-pod-onfailure", "annotations": {"k8flare.com/compute": "containers"}},
              "spec": {
                "restartPolicy": "OnFailure",
                "containers": [{"name": "demo", "image": "k8flare/demo:latest"}]
              }
            }' -o /dev/null

          for _ in $(seq 1 30); do
            docker ps --format '{{.Names}}' | grep -q PodContainerSmall && break
            sleep 3
          done
          CID=$(docker ps --format '{{.Names}}' | grep PodContainerSmall | grep -v -- -proxy | head -1)
          [ -n "$CID" ] || { echo "::error::smoke-pod-onfailure's container never started"; exit 1; }
          docker stop "$CID"

          for _ in $(seq 1 20); do
            docker ps --format '{{.Names}}' | grep -qx "$CID" && break
            sleep 2
          done
          docker ps --format '{{.Names}}' | grep -qx "$CID" || {
            echo "::error::OnFailure-restartPolicy container was not restarted after a nonzero exit"
            exit 1
          }
          echo "OnFailure: container restarted after nonzero exit, as expected."
          curl -sf -X DELETE "http://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod-onfailure" \
            -H "Authorization: Bearer k8flare-dev-token" -o /dev/null

      # Renamed from "Image allowlist" (the previous version of this
      # test's name): this repo never actually enforced an image
      # allowlist in code (workers/nodes' old ALLOWED_IMAGES/
      # isAllowedImage were already dead code, unreferenced by anything,
      # confirmed while rewriting this file 2026-07-11 -- and removed
      # rather than carried into the Go admission rewrite). What this
      # step actually exercises is the NodeVM's real containerd failing
      # to pull an image it has no reason to have cached/allowed, which
      # is a real, if weaker, guarantee than an explicit allowlist would
      # be. Left in as a regression check for that real failure path,
      # not as coverage of an allowlist this repo doesn't have.
      - name: A Pod naming an unpullable image ends up Failed
        run: |
          curl -sf -X POST "http://127.0.0.1:8930/api/v1/namespaces/default/pods" \
            -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
            -d '{
              "apiVersion": "v1", "kind": "Pod",
              "metadata": {"name": "smoke-pod-badimage", "annotations": {"k8flare.com/compute": "containers"}},
              "spec": {
                "restartPolicy": "Always",
                "containers": [{"name": "demo", "image": "k8flare/does-not-exist:latest"}]
              }
            }' -o /dev/null

          for _ in $(seq 1 30); do
            PHASE=$(curl -sf "http://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod-badimage" \
              -H "Authorization: Bearer k8flare-dev-token" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',{}).get('phase',''))")
            [ "$PHASE" = "Failed" ] && break
            sleep 3
          done
          [ "$PHASE" = "Failed" ] || {
            echo "::error::a Pod naming an unpullable image did not end up Failed (got: $PHASE)"
            exit 1
          }
          echo "Unpullable image correctly left the Pod Failed."

      - name: Tear down
        if: always()
        run: |
          curl -sf -X DELETE "http://127.0.0.1:8930/api/v1/namespaces/default/pods/smoke-pod-badimage" \
            -H "Authorization: Bearer k8flare-dev-token" -o /dev/null || true
          pkill -f "wrangler dev" || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-nodes-logs
          path: |
            ${{ runner.temp }}/wrangler.log
          if-no-files-found: ignore
