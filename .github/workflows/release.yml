name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  conformance:
    uses: ./.github/workflows/conformance.yml

  release:
    needs: conformance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
