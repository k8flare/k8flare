name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: pnpm install

      # Only apiserver's WASM ships (workers/controllers is ~19MiB gzip,
      # not deployable -- see docs/platform-verification.md's S8 section --
      # and is intentionally excluded from the release, so there's no need
      # to pay its build cost here).
      - name: Build WASM
        run: npm run build:wasm:apiserver

      # Package the 4 deployable Workers (gateway/apiserver/storage/runtime)
      # as one archive rather than 4 separate ones: each Worker's
      # package.json depends on shared packages/* via pnpm workspace links
      # (e.g. workers/gateway needs @k8flare/k8s, @k8flare/crd, ...), so a
      # standalone per-Worker tarball would be missing its own dependencies.
      # Bundling the whole workers/+packages/+root-workspace tree keeps
      # `pnpm install && npm run deploy` working unmodified from the
      # extracted archive, and ships the prebuilt workers/apiserver/build/
      # wasm so deploying doesn't require a local Go toolchain (only
      # wrangler + Cloudflare credentials). node_modules/.wrangler are
      # excluded since they're either regenerated by `pnpm install` or are
      # local dev state.
      - name: Package Workers
        run: |
          mkdir -p dist
          tar czf "dist/k8flare-workers-${{ github.ref_name }}.tar.gz" \
            --exclude=node_modules --exclude=.wrangler --exclude="*.tsbuildinfo" \
            workers/gateway workers/apiserver workers/storage workers/runtime \
            packages package.json pnpm-workspace.yaml pnpm-lock.yaml tsconfig.json

      - name: Build Agent (linux/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/k8flare-agent-linux-arm64 ./cmd/agent/

      - name: Build Agent (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/k8flare-agent-linux-amd64 ./cmd/agent/

      # cmd/scheduler and cmd/controller-manager are both BYO-VM/host-process
      # only -- neither can be deployed as a Worker (kube-scheduler doesn't
      # compile for GOOS=js/wasm at all, and kube-controller-manager's real
      # controller packages blow the 10MiB Workers gzip budget; see
      # docs/platform-verification.md's S8 section). Both binaries ship here
      # so a BYO VM deployment doesn't need a local Go toolchain either.
      - name: Build Scheduler (linux/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/k8flare-scheduler-linux-arm64 ./cmd/scheduler/

      - name: Build Scheduler (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/k8flare-scheduler-linux-amd64 ./cmd/scheduler/

      - name: Build Controller Manager (linux/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/k8flare-controller-manager-linux-arm64 ./cmd/controller-manager/

      - name: Build Controller Manager (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/k8flare-controller-manager-linux-amd64 ./cmd/controller-manager/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/k8flare-workers-*.tar.gz
            dist/k8flare-agent-*
            dist/k8flare-scheduler-*
            dist/k8flare-controller-manager-*
