name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"

      - name: Enable corepack (installed from npm -- runner Node images stopped bundling it, 2026-07)
        run: npm install -g corepack@latest && corepack enable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: pnpm install

      # Both control-plane binaries ship as Static Assets chunks of the
      # single consolidated Worker (Loader dynamic workers, S14/S19).
      - name: Install binaryen (wasm-opt) -- pinned release, not apt
        # Pinned to the same version developers use locally (mise
        # aqua:web-assembly/binaryen). apt/ubuntu ships an older binaryen
        # whose -Oz optimizes measurably worse: the SAME gc-wasm source
        # measured 65,204,713 bytes locally (version_129) but 67,222,931
        # bytes (+2.0MB, 111KiB OVER the 64MiB Loader cap) with apt's
        # binaryen on CI -- found 2026-07-10 when the e2e workflow's
        # Build WASM step failed while local builds passed. wasm-opt
        # version is part of the size gate's reproducibility.
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo "/opt/binaryen-version_129/bin" >> "$GITHUB_PATH"

      - name: Build WASM
        run: npm run build:wasm

      # Package the single consolidated Worker, keeping `pnpm install &&
      # npm run deploy` working unmodified from the extracted archive. The
      # prebuilt assets/wasm chunks ship inside packages/k8flare-worker so
      # deploying doesn't require a local Go toolchain (only wrangler +
      # Cloudflare credentials). node_modules/.wrangler are excluded since
      # they're either regenerated by `pnpm install` or local dev state.
      - name: Package Workers
        run: |
          mkdir -p dist
          tar czf "dist/k8flare-workers-${{ github.ref_name }}.tar.gz" \
            --exclude=node_modules --exclude=.wrangler --exclude="*.tsbuildinfo" \
            packages/k8flare-worker \
            package.json pnpm-workspace.yaml pnpm-lock.yaml tsconfig.json

      - name: Build Agent (linux/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/k8flare-agent-linux-arm64 ./cmd/agent/

      - name: Build Agent (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/k8flare-agent-linux-amd64 ./cmd/agent/

      # cmd/scheduler and cmd/controller-manager are the HOST-PROCESS builds,
      # shipped so a BYO VM deployment doesn't need a local Go toolchain.
      # (Correction 2026-07-30: this comment used to say kube-scheduler
      # "doesn't compile for GOOS=js/wasm at all". That stopped being true on
      # 2026-07-10 -- -tags schedwidth plus the DRA/CEL severing brought it to
      # ~45MB opt, and both kcm and sched now also ship as dynamic workers.
      # These host binaries remain the required conformance configuration and
      # the BYO-VM path, which is why they are still released.)
      - name: Build Scheduler (linux/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/k8flare-scheduler-linux-arm64 ./cmd/scheduler/

      - name: Build Scheduler (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/k8flare-scheduler-linux-amd64 ./cmd/scheduler/

      - name: Build Controller Manager (linux/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/k8flare-controller-manager-linux-arm64 ./cmd/controller-manager/

      - name: Build Controller Manager (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/k8flare-controller-manager-linux-amd64 ./cmd/controller-manager/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/k8flare-workers-*.tar.gz
            dist/k8flare-agent-*
            dist/k8flare-scheduler-*
            dist/k8flare-controller-manager-*
