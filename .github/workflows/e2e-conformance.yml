# Runs the official Kubernetes e2e conformance suite against a fully real,
# ephemeral instance of this stack: a real `wrangler dev` Worker (Go/WASM
# apiserver + Durable Object), a real k3s agent (kubelet + containerd + CNI),
# and the real embedded kube-scheduler and kube-controller-manager
# (cmd/scheduler, cmd/controller-manager). Everything runs local-only on the
# runner (127.0.0.1) — this never touches the deployed Cloudflare Worker.
name: E2E Conformance

# NOTE (2026-07-26): automatic triggers disabled -- GitHub Actions quota
# is limited; run manually via workflow_dispatch until re-enabled.
on:
  workflow_dispatch:

jobs:
  e2e-conformance:
    # Three control planes, one suite:
    #   host -- the REQUIRED gate: host kube-scheduler +
    #     kube-controller-manager processes, dynamic workers for kcm/sched
    #     disabled (gc dynamic worker always runs; the host has no GC).
    #   kcm-dw -- the kcm dynamic worker runs the workload controllers
    #     (no host controller-manager); the scheduler stays host.
    #   sched-dw -- the sched dynamic worker binds pods (no host
    #     scheduler); the workload controllers stay host.
    # Both dw variants are advisory (continue-on-error) until they have a
    # green track record. They exist because the v3 production shape had
    # ZERO conformance coverage; the FULL dw shape (all three dynamic
    # workers, no host processes) additionally wedges wrangler dev's
    # single workerd on standard runners -- four 40-63MB wasm modules in
    # one process is a local-emulation limit, not a product one -- see
    # docs/platform-verification.md S23 for the investigation and the
    # conditions for adding it back. Each variant here keeps the resident
    # module count at three (apiserver + two), the combination every
    # green historical run also had.
    strategy:
      fail-fast: false
      matrix:
        controlplane: [host, kcm-dw, sched-dw]
    continue-on-error: ${{ matrix.controlplane != 'host' }}
    runs-on: ubuntu-latest
    # Budget: setup (deps + wasm + binaries + cluster up) ~30min, baseline
    # ~7min, experimental step-capped at 20min, teardown seconds. The dw
    # variant adds its up-to-28min control-plane warmup (wasm compile
    # bound, see that step's comment), hence the larger budget.
    timeout-minutes: ${{ matrix.controlplane != 'host' && 85 || 70 }}
    steps:
      - name: Free disk space (remove unused preinstalled toolchains)
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "After:"; df -h /

      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"

      - name: Enable corepack (installed from npm -- runner Node images stopped bundling it, 2026-07)
        run: npm install -g corepack@latest && corepack enable

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: pnpm install

      - name: Install binaryen (wasm-opt) -- pinned release, not apt
        # Pinned to the same version developers use locally (mise
        # aqua:web-assembly/binaryen). apt/ubuntu ships an older binaryen
        # whose -Oz optimizes measurably worse: the SAME gc-wasm source
        # measured 65,204,713 bytes locally (version_129) but 67,222,931
        # bytes (+2.0MB, 111KiB OVER the 64MiB Loader cap) with apt's
        # binaryen on CI -- found 2026-07-10 when the e2e workflow's
        # Build WASM step failed while local builds passed. wasm-opt
        # version is part of the size gate's reproducibility.
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | sudo tar xz -C /opt
          echo "/opt/binaryen-version_129/bin" >> "$GITHUB_PATH"

      - name: Build WASM
        run: npm run build:wasm

      - name: Build Agent (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/k8flare-agent ./cmd/agent/

      - name: Build Scheduler (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/k8flare-scheduler ./cmd/scheduler/

      - name: Build Controller Manager (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/k8flare-controller-manager ./cmd/controller-manager/

      # The CNI `portmap` plugin (exercised by the hostPort conformance test in
      # the baseline group below) shells out to the `iptables` binary. Not
      # guaranteed present on every ubuntu-latest image, so install it
      # defensively regardless.
      - name: Install iptables
        run: |
          sudo apt-get update
          sudo apt-get install -y iptables

      # cmd/agent's prepareK3sDataDir() (main.go) shells out to `k3s
      # check-config` purely to trigger k3s's own extraction of its embedded
      # CNI plugins / containerd / runc into <data-dir>/data/<hash>/bin. The
      # agent code that actually runs is the go.mod-pinned k3s module embedded
      # via pkg/executor/embed — this installed binary is only ever used as
      # the source for that one-time asset extraction, so it doesn't need to
      # match go.mod's k3s version exactly. INSTALL_K3S_SKIP_START stops it
      # from ever starting its own server/agent (the systemd unit is installed
      # but not run), so it can't compete with cmd/agent for ports/containerd.
      - name: Install k3s binary (source for CNI/containerd/runc extraction)
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_SKIP_START=true sh -
          k3s --version

      - name: Download Kubernetes e2e test binaries
        run: |
          curl -sfL -o "$RUNNER_TEMP/kubernetes-test-linux-amd64.tar.gz" \
            https://dl.k8s.io/v1.36.2/kubernetes-test-linux-amd64.tar.gz
          tar xzf "$RUNNER_TEMP/kubernetes-test-linux-amd64.tar.gz" -C "$RUNNER_TEMP"

      # Token choice: k8flare's AuthMiddleware (pkg/apiserver/auth.go) treats
      # any bearer token equal to the cluster's shared token as authenticated
      # system:masters — there's no per-user auth to model here. We deliberately
      # do NOT generate a random token or write .dev.vars files for the
      # gateway/apiserver/runtime Workers: wrangler resolves .dev.vars
      # relative to each wrangler config's own directory, not the invocation
      # cwd, so a token dropped at the repo root would silently be ignored
      # for all of them (verified locally: this repo's root .dev.vars is not
      # loaded by the `wrangler dev` invocation below, since it's
      # not next to the wrangler.jsonc). With no K3S_TOKEN
      # set, main.go's getToken() (Go apiserver) and the TS Workers' dwAuth
      # (packages/k8s/src/auth.ts) all fall back to the same hardcoded
      # "k8flare-dev-token" dev value — the exact fallback
      # pkg/apiserver/apiserver_test.go's setupWranglerDev already relies on.
      # Reusing that proven fallback everywhere (the Worker, agent,
      # scheduler) is simpler than wiring up a fresh random token end-to-end
      # for a value that is never a real secret in this ephemeral,
      # localhost-only CI instance.
      #
      # HTTPS is not optional here, for either the agent or the scheduler:
      # client-go's clientcmd only applies a kubeconfig file's credentials —
      # including the bearer token — when rest.IsConfigTransportTLS reports
      # true (client-go's client_config.go: "only try to read the auth
      # information if we are secure"). Both the real kube-scheduler and k3s's
      # embedded kubelet load their client from exactly such a file, so
      # against a plain-HTTP server every one of their requests would be
      # silently sent unauthenticated rather than fail loudly (verified
      # locally against cmd/scheduler: informers reported "synced" while
      # receiving zero actual objects). Generating our own cert (rather than
      # wrangler's auto-generated one) gives a known path to add to the
      # runner's system trust store, so the agent's existing
      # cacert.ReplaceServerCA — built for a publicly-trusted prod cert, not a
      # self-signed one — validates it with no code changes.
      - name: Generate a self-signed TLS cert for the local dev instance
        run: |
          mkdir -p "$RUNNER_TEMP/devtls"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$RUNNER_TEMP/devtls/dev.key" -out "$RUNNER_TEMP/devtls/dev.crt" \
            -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
          sudo cp "$RUNNER_TEMP/devtls/dev.crt" /usr/local/share/ca-certificates/k8flare-dev.crt
          sudo update-ca-certificates

      - name: Write kubeconfig for the local dev instance
        run: |
          cat > "$RUNNER_TEMP/kubeconfig.yaml" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
            - name: k8flare-dev
              cluster:
                server: https://127.0.0.1:8787
                insecure-skip-tls-verify: true
          users:
            - name: k8flare-dev
              user:
                token: k8flare-dev-token
          contexts:
            - name: k8flare-dev
              context:
                cluster: k8flare-dev
                user: k8flare-dev
          current-context: k8flare-dev
          EOF

      # --local is required now, not just a style choice: wrangler.jsonc's
      # `vpc_networks` MESH binding (added in b6d4340 for the Mesh kubelet
      # proxy) has no local emulation at all, so plain `wrangler dev` -- with
      # or without that binding's own "remote": true -- tries to establish a
      # real remote-proxy session for it at STARTUP and hard-fails before
      # ever binding a port if no Cloudflare credentials are present, which
      # is exactly this job's state (no CLOUDFLARE_API_TOKEN secret, by
      # design -- see the ClusterIP verification step below for why). This
      # was a real, undetected regression: confirmed via `gh run list` that
      # no e2e-conformance run has executed since b6d4340 landed, so nothing
      # had caught it. `--local` disables remote bindings outright, which is
      # exactly what this job wants (MESH is unused by every test here) and
      # requires no change to the committed wrangler.jsonc, so the real
      # deployed Worker's Mesh feature is unaffected.
      - name: Start wrangler dev (real Workers + Durable Object storage)
        run: |
          # SCHED_DISABLED: this job runs a HOST kube-scheduler process
          # (control-plane step below); the in-Worker sched dynamic
          # worker must stay unloaded or two live schedulers race on
          # Bindings and flake sig-scheduling. CM_DISABLED for the same
          # reason on the workload-controller side: the host
          # kube-controller-manager is authoritative here, and running
          # the kcm dynamic worker alongside it meant TWO replication
          # controllers with independent informer lags racing each
          # other's back-fills (part of the GC orphan canary's flake,
          # see that step's comment). The gc dynamic worker stays live
          # -- the host runs no garbage collector.
          nohup npx wrangler dev \
            -c workers/k8flare/wrangler.jsonc \
            --enable-containers=false \
            --var SCHED_DISABLED:${{ matrix.controlplane == 'sched-dw' && '0' || '1' }} \
            --var CM_DISABLED:${{ matrix.controlplane == 'kcm-dw' && '0' || '1' }} \
            --local \
            --port 8787 \
            --local-protocol https \
            --https-key-path "$RUNNER_TEMP/devtls/dev.key" \
            --https-cert-path "$RUNNER_TEMP/devtls/dev.crt" \
            --persist-to .wrangler/state \
            --log-level ${{ matrix.controlplane != 'host' && 'info' || 'error' }} \
            > "$RUNNER_TEMP/wrangler.log" 2>&1 &

          echo "Waiting for wrangler dev on 127.0.0.1:8787..."
          for _ in $(seq 1 60); do
            if curl -sk -o /dev/null "https://127.0.0.1:8787/"; then
              break
            fi
            sleep 1
          done
          # Mirrors setupWranglerDev's extra grace period (pkg/apiserver/apiserver_test.go).
          sleep 2

          curl -skf -o /dev/null https://127.0.0.1:8787/api/v1/namespaces \
            -H "Authorization: Bearer k8flare-dev-token" || {
            echo "::error::wrangler dev did not come up cleanly"
            cat "$RUNNER_TEMP/wrangler.log"
            exit 1
          }

      # containerd/cgroups/network namespaces need root. GitHub-hosted
      # ubuntu-latest runners grant the default `runner` user passwordless
      # sudo, which is sufficient here — no self-hosted runner needed.
      - name: Start k3s agent (real kubelet + containerd)
        run: |
          # shellcheck disable=SC2024 # intentional: $RUNNER_TEMP is writable by
          # the unprivileged runner user, so this redirect (opened before sudo
          # raises privilege) deliberately produces a non-root-owned log file
          # the later "Upload logs" step can read without sudo.
          sudo nohup ./bin/k8flare-agent \
            --server=https://127.0.0.1:8787 \
            --token=k8flare-dev-token \
            --node-name=e2e-runner \
            --data-dir=/var/lib/rancher/k3s \
            > "$RUNNER_TEMP/agent.log" 2>&1 &

          sleep 5
          pgrep -f k8flare-agent > /dev/null || {
            echo "::error::k8flare-agent exited immediately; see uploaded agent.log"
            cat "$RUNNER_TEMP/agent.log"
            exit 1
          }

      - name: Wait for node to register as Ready
        run: |
          # cmd/agent sets WithNodeID=true (k3s appends a short random suffix
          # to the configured --node-name to avoid collisions), so the actual
          # registered name is "e2e-runner-<random>", not the bare
          # "e2e-runner" passed on the command line. Match by prefix.
          for _ in $(seq 1 60); do
            READY=$(curl -sk https://127.0.0.1:8787/api/v1/nodes \
              -H "Authorization: Bearer k8flare-dev-token" \
              | jq -r '.items[]? | select(.metadata.name | startswith("e2e-runner")) | .status.conditions[]? | select(.type=="Ready") | .status' 2>/dev/null) || true
            [ "$READY" = "True" ] && break
            sleep 5
          done

          if [ "$READY" != "True" ]; then
            echo "::error::node e2e-runner-* did not become Ready in time; see uploaded agent.log"
            cat "$RUNNER_TEMP/agent.log"
            exit 1
          fi
          echo "Node is Ready."

      # No sudo needed here: the scheduler only writes its own kubeconfig and
      # KubeSchedulerConfiguration, then talks to the apiserver over HTTPS —
      # --data-dir is pointed at a runner-writable temp dir instead of its
      # (root-owned-by-default) production default. --insecure-skip-tls-verify
      # is belt-and-suspenders on top of the system trust store install above.
      - name: Start scheduler (real kube-scheduler)
        if: matrix.controlplane != 'sched-dw'
        run: |
          nohup ./bin/k8flare-scheduler \
            --server=https://127.0.0.1:8787 \
            --token=k8flare-dev-token \
            --data-dir="$RUNNER_TEMP/k8flare-scheduler" \
            --insecure-skip-tls-verify \
            > "$RUNNER_TEMP/scheduler.log" 2>&1 &

          sleep 5
          pgrep -f k8flare-scheduler > /dev/null || {
            echo "::error::k8flare-scheduler exited immediately; see uploaded scheduler.log"
            cat "$RUNNER_TEMP/scheduler.log"
            exit 1
          }

      # Same rationale as the scheduler step above: no sudo, own kubeconfig,
      # runner-writable --data-dir. --controllers= enables exactly the six
      # workload controllers this project's apiserver has been verified
      # against (see docs/general-purpose-k8s-plan.md, Phase 3) --
      # garbagecollector is registered by the same real binary but not
      # enabled here pending its own verification pass (metadata-only
      # client + RESTMapper, see Phase 3's OwnerReference GC entry).
      - name: Start controller-manager (real kube-controller-manager)
        if: matrix.controlplane != 'kcm-dw'
        run: |
          nohup ./bin/k8flare-controller-manager \
            --server=https://127.0.0.1:8787 \
            --token=k8flare-dev-token \
            --data-dir="$RUNNER_TEMP/k8flare-controller-manager" \
            --insecure-skip-tls-verify \
            > "$RUNNER_TEMP/controller-manager.log" 2>&1 &

          sleep 5
          pgrep -f k8flare-controller-manager > /dev/null || {
            echo "::error::k8flare-controller-manager exited immediately; see uploaded controller-manager.log"
            cat "$RUNNER_TEMP/controller-manager.log"
            exit 1
          }

      # dw variant only: the control plane is the kcm/sched/gc dynamic
      # workers, and their first load is poke-driven (~1-2 minutes of
      # Loader assembly each). Readiness is checked BEHAVIORALLY -- one
      # throwaway Deployment must go Pod-Running (kcm created it, sched
      # bound it, the kubelet ran it) and then cascade away on delete
      # (gc) -- so the conformance clock never starts against a
      # still-loading control plane, and all three dynamic workers are
      # proven live before any test runs.
      - name: Wait for the dynamic-worker control plane (behavioral)
        if: matrix.controlplane != 'host'
        # Generous, deliberately: the first poke loads kcm+sched+gc
        # (~150MB of wasm) CONCURRENTLY, and compiling that much wasm on
        # a 2-vCPU runner blocks workerd's event loop for many minutes
        # -- run 29169330476's wrangler.log stops dead at the warmup
        # deployment's 201 and resumes only after the compiles finish.
        # The polling loop is TIME-bounded (20min) so the failure
        # diagnostics always run inside the step timeout, unlike the
        # first attempt whose iteration-bounded loop outlived it.
        timeout-minutes: 28
        run: |
          AUTH="Authorization: Bearer k8flare-dev-token"
          curl -skf --max-time 30 -o /dev/null -X POST https://127.0.0.1:8787/apis/apps/v1/namespaces/default/deployments \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"apiVersion":"apps/v1","kind":"Deployment","metadata":{"name":"dw-warmup"},"spec":{"replicas":1,"selector":{"matchLabels":{"app":"dw-warmup"}},"template":{"metadata":{"labels":{"app":"dw-warmup"}},"spec":{"containers":[{"name":"c","image":"registry.k8s.io/pause:3.10"}]}}}}'
          echo "Waiting for the warmup Pod to reach Running (kcm -> sched -> kubelet)..."
          PHASE=""
          while [ "$SECONDS" -lt 1200 ]; do
            PHASE=$(curl -sk --max-time 10 "https://127.0.0.1:8787/api/v1/namespaces/default/pods?labelSelector=app%3Ddw-warmup" \
              -H "$AUTH" | python3 -c "import json,sys; items=json.load(sys.stdin).get('items',[]); print(items[0].get('status',{}).get('phase','') if items else '')" 2>/dev/null || true)
            [ "$PHASE" = "Running" ] && break
            sleep 10
          done
          [ "$PHASE" = "Running" ] || {
            echo "::error::dw control plane warmup: Pod never reached Running (last: $PHASE)"
            echo "=== deployment ==="
            curl -sk --max-time 10 "https://127.0.0.1:8787/apis/apps/v1/namespaces/default/deployments/dw-warmup" -H "$AUTH"
            echo; echo "=== replicasets ==="
            curl -sk --max-time 10 "https://127.0.0.1:8787/apis/apps/v1/namespaces/default/replicasets" -H "$AUTH"
            echo; echo "=== pods ==="
            curl -sk --max-time 10 "https://127.0.0.1:8787/api/v1/namespaces/default/pods" -H "$AUTH"
            echo; echo "=== events ==="
            curl -sk --max-time 10 "https://127.0.0.1:8787/api/v1/namespaces/default/events" -H "$AUTH"
            echo; echo "=== wrangler.log tail ==="
            tail -100 "$RUNNER_TEMP/wrangler.log" || true
            exit 1
          }
          echo "Warmup Pod Running. Deleting and waiting for the GC cascade..."
          curl -skf --max-time 30 -o /dev/null -X DELETE https://127.0.0.1:8787/apis/apps/v1/namespaces/default/deployments/dw-warmup -H "$AUTH"
          for _ in $(seq 1 60); do
            N=$(curl -sk --max-time 10 "https://127.0.0.1:8787/api/v1/namespaces/default/pods?labelSelector=app%3Ddw-warmup" \
              -H "$AUTH" | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('items',[])))" 2>/dev/null || echo "?")
            [ "$N" = "0" ] && break
            sleep 5
          done
          [ "$N" = "0" ] || {
            echo "::error::dw control plane warmup: GC never cascaded the warmup pods (remaining: $N)"
            exit 1
          }
          echo "Dynamic-worker control plane is live (kcm + sched + gc all verified behaviorally)."

      # Baseline group: 11 Conformance tests (2 NodeSelector + 1 resource-limits
      # + 1 hostPort + 2 LimitRange + 5 Watchers) already fully validated this
      # session against this exact apiserver. Required check.
      - name: Run baseline conformance tests (required)
        run: |
          echo "=== BASELINE (required) conformance group ==="
          BASELINE_FOCUS='\[sig-scheduling\] SchedulerPredicates .* validates that NodeSelector is respected if (not )?matching \[Conformance\]|\[sig-scheduling\] SchedulerPredicates .* validates resource limits of pods that are allowed to run \[Conformance\]|\[sig-scheduling\] SchedulerPredicates .* validates that there exists conflict between pods with same hostPort and protocol but one using 0\.0\.0\.0 hostIP \[Conformance\]|\[sig-scheduling\] LimitRange .*\[Conformance\]|\[sig-api-machinery\] Watchers'

          "$RUNNER_TEMP/kubernetes/test/bin/e2e.test" \
            --kubeconfig="$RUNNER_TEMP/kubeconfig.yaml" \
            --provider=skeleton \
            --num-nodes=1 \
            --disable-log-dump \
            --ginkgo.no-color \
            --ginkgo.focus="$BASELINE_FOCUS"

      # REQUIRED: the real upstream garbage collector (pkg/controllers/gc)
      # against all 7 [Conformance]-tagged tests under
      # "[sig-api-machinery] Garbage collector" in the downloaded v1.36.2
      # e2e.test binary (test/e2e/apimachinery/garbage_collector.go),
      # identified locally via `e2e.test --list-tests`. Two other GC
      # tests in that file (cronjob cleanup, custom-resource
      # cascading/orphan deletion) carry no [Conformance] tag and are
      # excluded.
      #
      # Promoted from advisory to required 2026-07-11 after run
      # 29136960838 went 7/7. The "orphan pods created by rc [Serial]"
      # test was temporarily demoted to a throughput canary (2026-07-12)
      # when it flaked 5 runs straight on loaded runners; the root cause
      # turned out to be client-go's DEFAULT 5-QPS limiter throttling
      # every resident controller (unset QPS in the WASM rest.Config)
      # plus TWO controller-managers racing (the kcm dynamic worker ran
      # alongside the host one until CM_DISABLED). With QPS 50 and a
      # single controller-manager, run 29161962551 passed the canary and
      # cut this group's wall time from ~8min to ~3min -- re-promoted. Getting there took, in order: enabling the
      # real ReplicationController controller (9b01689 -- 1/7 -> 5/7),
      # retrying delete-vs-concurrent-write conflicts in storage
      # (729e6fb), and handing Orphan/Foreground propagation to the real
      # GC via the minimal finalizer lifecycle (7c80d1d,
      # pkg/apiserver/gracefuldelete.go) -- each intermediate failure is
      # documented in those commits.
      #
      # Runs BEFORE the ClusterIP routing gate below, not at the end of
      # the job: that required gate has a known intermittent failure mode
      # (run 29133645770, 2026-07-11 -- the probe pod retried the wget for
      # a full 50s and never reached the ClusterIP, so this is NOT the
      # brief kube-proxy sync lag the probe's retry loop was built for;
      # when it strikes, routing is broken for that run's lifetime, root
      # cause still open). Sitting after it, this group lost its entire
      # ~8min of signal every time that unrelated gate flaked.
      - name: Run garbage collector conformance tests (required)
        id: garbage-collector
        timeout-minutes: 15
        run: |
          echo "=== GARBAGE COLLECTOR (required) conformance group ==="
          GC_FOCUS='\[sig-api-machinery\] Garbage collector should delete RS created by deployment when not orphaning \[Conformance\]|\[sig-api-machinery\] Garbage collector should delete pods created by rc when not orphaning \[Conformance\]|\[sig-api-machinery\] Garbage collector should keep the rc around until all its pods are deleted if the deleteOptions says so \[Serial\] \[Conformance\]|\[sig-api-machinery\] Garbage collector should not be blocked by dependency circle \[Conformance\]|\[sig-api-machinery\] Garbage collector should not delete dependents that have both valid owner and owner that'\''s waiting for dependents to be deleted \[Serial\] \[Conformance\]|\[sig-api-machinery\] Garbage collector should orphan RS created by deployment when deleteOptions\.PropagationPolicy is Orphan \[Conformance\]|\[sig-api-machinery\] Garbage collector should orphan pods created by rc if delete options say so \[Serial\] \[Conformance\]'

          "$RUNNER_TEMP/kubernetes/test/bin/e2e.test" \
            --kubeconfig="$RUNNER_TEMP/kubeconfig.yaml" \
            --provider=skeleton \
            --num-nodes=1 \
            --disable-log-dump \
            --ginkgo.no-color \
            --ginkgo.focus="$GC_FOCUS"

      # Phase 1 promotion gate, REQUIRED: proves real ClusterIP packet
      # routing end-to-end (a genuinely separate Pod's network namespace
      # reaches a Service's ClusterIP and gets DNAT-routed to the backing
      # Pod by the real embedded kube-proxy) WITHOUT kubectl exec or kubectl
      # logs. Both go through gateway/proxy/target.ts's
      # resolveKubeletTarget(), which requires the MESH (vpc_networks,
      # remote-only, see the wrangler dev step's comment above) or legacy
      # KUBELET_VPC binding for BYO-VM nodes -- neither has local-dev
      # emulation, and minting a real Mesh connector token per ephemeral CI
      # run would mean touching real Cloudflare infrastructure (and a new,
      # sensitive CLOUDFLARE_API_TOKEN CI secret) on every PR, which breaks
      # this job's deliberate "local-only, never touches the deployed
      # Worker" design -- so the upstream
      # `[sig-network] Services should serve a basic endpoint from pods
      # [Conformance]` test below can never pass in this harness as-is (its
      # own reachability check is exec-driven, not a routing test). This
      # step proves the identical underlying claim through a channel that
      # needs neither exec nor logs: Pod phase / container exitCode, which
      # kubelet reports to the apiserver directly over the same path every
      # other step in this job already polls with curl+jq.
      #
      # Verified by hand first (not just written from reading the code, per
      # this repo's rule 2): a real wrangler dev + real k3s agent (kube-proxy
      # in iptables mode, flannel host-gw) reproduced this exact scenario --
      # a backend Pod running nginx behind a Service, and a separate busybox
      # Pod, in its OWN network namespace, entered via `crictl exec`
      # (container-runtime level, bypassing this project's own kubectl-exec
      # gap entirely) -- and a `wget` to the ClusterIP returned nginx's real
      # response. See docs/general-purpose-k8s-plan.md, Phase 1.
      - name: Verify real ClusterIP traffic routing (Phase 1 promotion gate, exec-free)
        run: |
          set -e
          echo "=== creating a real backend Pod + Service ==="
          curl -skf -X POST https://127.0.0.1:8787/api/v1/namespaces/default/pods \
            -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
            -d '{"apiVersion":"v1","kind":"Pod","metadata":{"name":"clusterip-verify-backend","labels":{"app":"clusterip-verify"}},"spec":{"containers":[{"name":"web","image":"docker.io/library/nginx:alpine","ports":[{"containerPort":80}]}]}}' > /dev/null

          curl -skf -X POST https://127.0.0.1:8787/api/v1/namespaces/default/services \
            -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
            -d '{"apiVersion":"v1","kind":"Service","metadata":{"name":"clusterip-verify-backend"},"spec":{"selector":{"app":"clusterip-verify"},"ports":[{"port":80,"targetPort":80}]}}' > /dev/null

          echo "Waiting for the backend Pod to run (real scheduler binds it, real kubelet pulls+starts it)..."
          PHASE=""
          for _ in $(seq 1 30); do
            PHASE=$(curl -sk https://127.0.0.1:8787/api/v1/namespaces/default/pods/clusterip-verify-backend \
              -H "Authorization: Bearer k8flare-dev-token" | jq -r '.status.phase')
            [ "$PHASE" = "Running" ] && break
            sleep 3
          done
          if [ "$PHASE" != "Running" ]; then
            echo "::error::backend Pod never became Running (phase=$PHASE)"
            curl -sk https://127.0.0.1:8787/api/v1/namespaces/default/pods/clusterip-verify-backend -H "Authorization: Bearer k8flare-dev-token"
            exit 1
          fi

          CLUSTER_IP=$(curl -sk https://127.0.0.1:8787/api/v1/namespaces/default/services/clusterip-verify-backend \
            -H "Authorization: Bearer k8flare-dev-token" | jq -r '.spec.clusterIP')
          echo "ClusterIP: $CLUSTER_IP"

          # Retry loop, not a single wget: a first-run failure (2026-07-10,
          # run 29110617118) showed the probe container running for exactly
          # 5s (wget's -T5 timeout) before exiting 1 -- a TCP connect that
          # hung rather than an immediate refusal, even though the backend
          # Pod already reported phase=Running and its EndpointSlice had
          # already gone ready=true 1.5s earlier. That points at kube-proxy's
          # iptables sync lagging slightly behind the endpoint becoming
          # ready, not the backend container itself -- so the fix retries
          # past that lag instead of trying to wait on a single readiness
          # signal that isn't guaranteed to cover kube-proxy's own sync
          # delay.
          echo "=== creating a SEPARATE probe Pod that curls the ClusterIP and exits accordingly (restartPolicy: Never) ==="
          curl -skf -X POST https://127.0.0.1:8787/api/v1/namespaces/default/pods \
            -H "Authorization: Bearer k8flare-dev-token" -H "Content-Type: application/json" \
            -d "{\"apiVersion\":\"v1\",\"kind\":\"Pod\",\"metadata\":{\"name\":\"clusterip-verify-probe\"},\"spec\":{\"restartPolicy\":\"Never\",\"containers\":[{\"name\":\"probe\",\"image\":\"docker.io/library/busybox:1.36\",\"command\":[\"sh\",\"-c\",\"i=0; while [ \$i -lt 10 ]; do wget -T3 -O- http://$CLUSTER_IP:80/ 2>/dev/null | grep -q 'Welcome to nginx' && exit 0; i=\$((i+1)); sleep 2; done; exit 1\"]}]}}" > /dev/null

          echo "Waiting for the probe Pod to complete..."
          PHASE=""
          for _ in $(seq 1 30); do
            PHASE=$(curl -sk https://127.0.0.1:8787/api/v1/namespaces/default/pods/clusterip-verify-probe \
              -H "Authorization: Bearer k8flare-dev-token" | jq -r '.status.phase')
            [ "$PHASE" = "Succeeded" ] || [ "$PHASE" = "Failed" ] && break
            sleep 3
          done

          if [ "$PHASE" != "Succeeded" ]; then
            echo "::error::ClusterIP probe Pod did not succeed (phase=$PHASE) -- real ClusterIP traffic routing is broken"
            # Root-cause material for the 50s-of-retries failure mode (run
            # 29133645770): is the EndpointSlice pointing at a live pod IP,
            # is the backend actually still Running, and what does the
            # node's own iptables DNAT chain for this ClusterIP look like.
            echo "=== probe pod ==="
            curl -sk https://127.0.0.1:8787/api/v1/namespaces/default/pods/clusterip-verify-probe -H "Authorization: Bearer k8flare-dev-token"
            echo; echo "=== backend pod ==="
            curl -sk https://127.0.0.1:8787/api/v1/namespaces/default/pods/clusterip-verify-backend -H "Authorization: Bearer k8flare-dev-token"
            echo; echo "=== endpointslices ==="
            curl -sk https://127.0.0.1:8787/apis/discovery.k8s.io/v1/namespaces/default/endpointslices -H "Authorization: Bearer k8flare-dev-token"
            echo; echo "=== endpoints ==="
            curl -sk https://127.0.0.1:8787/api/v1/namespaces/default/endpoints -H "Authorization: Bearer k8flare-dev-token"
            echo; echo "=== iptables DNAT rules for $CLUSTER_IP ==="
            sudo iptables-save -t nat | grep -F "$CLUSTER_IP" || echo "(no nat rules mention $CLUSTER_IP)"
            echo "=== KUBE-SERVICES chain head ==="
            sudo iptables-save -t nat | grep -c "KUBE-" || true
            exit 1
          fi
          echo "Real ClusterIP traffic routing confirmed: a separate Pod's network namespace reached $CLUSTER_IP and received the backend's actual HTTP response."

      # The actual upstream conformance test named as Phase 1's acceptance
      # criterion. Kept here, still advisory: its own reachability check is
      # exec-driven (see the required step above for the full trace of why
      # that can't work in this harness), so it cannot pass here regardless
      # of whether ClusterIP routing itself works -- this remains a standing
      # probe in case a future Mesh-in-CI path or an upstream test-framework
      # option to swap the reachability mechanism changes that, not a
      # meaningful pass/fail signal today.
      #
      # FIRST RUN (2026-07-06) FAILED -- see docs/general-purpose-k8s-plan.md
      # Phase 1's open follow-ups for the ginkgo detail. It never reached
      # kube-proxy: upstream's own reachability check drives itself via
      # `kubectl exec <pod> -- nc ...`, and exec itself doesn't work in this
      # CI harness (README's documented gap -- exec needs the optional
      # Tunnel+VPC setup, not configured here). continue-on-error means a
      # RED ginkgo run still shows as a green GitHub Actions step -- read the
      # step's own log, not its conclusion.
      - name: Run ClusterIP traffic candidate (Phase 1 upstream conformance test, advisory)
        id: cluster-ip-traffic
        continue-on-error: true
        timeout-minutes: 10
        run: |
          echo "=== ClusterIP real-traffic candidate ==="
          "$RUNNER_TEMP/kubernetes/test/bin/e2e.test" \
            --kubeconfig="$RUNNER_TEMP/kubeconfig.yaml" \
            --provider=skeleton \
            --num-nodes=1 \
            --disable-log-dump \
            --ginkgo.no-color \
            --ginkgo.focus='\[sig-network\] Services should serve a basic endpoint from pods \[Conformance\]'

      # Experimental group: broader Conformance tests for resources README.md
      # documents as implemented (ConfigMap/Secret/Namespace-cascade), but
      # which are not yet individually confirmed against this apiserver the
      # way the baseline group above is. Advisory only, must never fail the
      # required check.
      #
      # The step carries its OWN timeout, well inside the job's: without it,
      # a slow advisory run rides into the job-level timeout and the whole
      # run -- required baseline success included -- is reported as
      # cancelled (observed 2026-07-06, run 28806577705: baseline SUCCESS,
      # job cancelled at 55min mid-experimental). continue-on-error only
      # absorbs step failure, not job cancellation, so the step must be
      # the thing that dies first.
      - name: Run experimental conformance tests (advisory, non-blocking)
        id: experimental
        continue-on-error: true
        timeout-minutes: 20
        run: |
          echo "=== EXPERIMENTAL (advisory, not yet individually confirmed) conformance group ==="
          # Note: "Services should serve a basic endpoint from pods" is deliberately
          # excluded -- it requires actual ClusterIP packet routing via kube-proxy,
          # which is enabled (supervisor.go's DisableKubeProxy: false) and joins
          # successfully, but real traffic routing end-to-end isn't proven yet (see
          # docs/general-purpose-k8s-plan.md, Phase 1). Only EndpointSlice/Endpoints
          # object computation is verified here.
          #
          # ReplicaSet/Deployment/Job tests below are exact codenames verified
          # against the downloaded e2e.test binary's embedded conformance
          # metadata. ReplicaSet/Deployment/Job/CronJob/DaemonSet are now backed
          # by the real, unmodified kube-controller-manager (cmd/controller-manager,
          # started above) rather than a hand-written reimplementation, so most of
          # the tests previously excluded here for implementation gaps (Pod
          # adoption, proportional scaling, Indexed Jobs, podFailurePolicy,
          # successPolicy, spec.suspend) are included now -- the real controller
          # code handles all of this identically to any other real cluster; this
          # apiserver just needs to store/serve the fields correctly, which is the
          # same generic JSON path every other type already goes through. Still
          # excluded because they exercise a genuine, still-true apiserver gap:
          # ReplicaSet/Deployment's "should have a working scale subresource"
          # (no /scale subresource, only whole-object PUT -- unlike /status,
          # which now exists). Still excluded for reasons unrelated to which
          # controller manages the Job: "should run a job to completion when
          # tasks sometimes fail and are locally restarted" (uncertain whether
          # this needs kubelet-level container restart semantics this stack
          # hasn't specifically verified).
          #
          # CronJob is thoroughly verified this session (schedule parsing,
          # Job/Pod creation, concurrencyPolicy: Allow/Forbid/Replace, suspend,
          # successful/failedJobsHistoryLimit GC -- see
          # docs/general-purpose-k8s-plan.md) but deliberately not added here:
          # its conformance tests need to observe real schedule ticks (two are
          # explicitly [Slow]-tagged upstream), and this step's 20-minute
          # timeout is a hard ceiling regardless of continue-on-error -- not
          # worth risking for an advisory-only signal. Same reasoning applies
          # regardless of which controller (hand-written or real) runs it.
          EXPERIMENTAL_FOCUS='\[sig-node\] ConfigMap .*\[Conformance\]|\[sig-node\] Secrets .*\[Conformance\]|\[sig-api-machinery\] Namespaces \[Serial\] should (ensure that all (pods|services) are removed when a namespace is deleted|patch a Namespace|apply an update to a Namespace) \[Conformance\]|\[sig-network\] EndpointSlice should create Endpoints and EndpointSlices for Pods matching a Service \[Conformance\]|\[sig-network\] EndpointSlice should create and delete EndpointSlices for a Service with a selector that matches no pods \[Conformance\]|\[sig-network\] EndpointsController should create Endpoints for Pods matching a Service \[Conformance\]|\[sig-network\] EndpointsController should create and delete Endpoints for a Service with a selector that matches no pods \[Conformance\]|\[sig-apps\] ReplicaSet Replace and Patch tests \[Conformance\]|\[sig-apps\] ReplicaSet should list and delete a collection of ReplicaSets \[Conformance\]|\[sig-apps\] ReplicaSet should serve a basic image on each replica with a public image \[Conformance\]|\[sig-apps\] ReplicaSet should adopt matching pods on creation and release no longer matching pods \[Conformance\]|\[sig-apps\] ReplicaSet should validate Replicaset Status endpoints \[Conformance\]|\[sig-apps\] Deployment RecreateDeployment should delete old pods and create new ones \[Conformance\]|\[sig-apps\] Deployment RollingUpdateDeployment should delete old pods and create new ones \[Conformance\]|\[sig-apps\] Deployment deployment should delete old replica sets \[Conformance\]|\[sig-apps\] Deployment deployment should support rollover \[Conformance\]|\[sig-apps\] Deployment deployment should support proportional scaling \[Conformance\]|\[sig-apps\] Deployment should run the lifecycle of a Deployment \[Conformance\]|\[sig-apps\] Deployment should validate Deployment Status endpoints \[Conformance\]|\[sig-apps\] Job should delete a job \[Conformance\]|\[sig-apps\] Job should adopt matching orphans and release non-matching pods \[Conformance\]|\[sig-apps\] Job should apply changes to a job status \[Conformance\]|\[sig-apps\] Job should manage the lifecycle of a job \[Conformance\]|\[sig-apps\] Job should create pods for an Indexed job with completion indexes and specified hostname \[Conformance\]|\[sig-apps\] Job should execute all indexes despite some failing when using backoffLimitPerIndex \[Conformance\]|\[sig-apps\] Job should terminate job execution when the number of failed indexes exceeds maxFailedIndexes \[Conformance\]|\[sig-apps\] Job should mark indexes as failed when the FailIndex action is matched in podFailurePolicy \[Conformance\]|\[sig-apps\] Job should allow to use the pod failure policy on exit code to fail the job early \[Conformance\]|\[sig-apps\] Job should allow to use a pod failure policy to ignore failure matching on DisruptionTarget condition \[Conformance\]|\[sig-apps\] Job with successPolicy should succeeded when all indexes succeeded \[Conformance\]|\[sig-apps\] Job with successPolicy succeededCount rule should succeeded even when some indexes remain pending \[Conformance\]|\[sig-apps\] Job with successPolicy succeededIndexes rule should succeeded even when some indexes remain pending \[Conformance\]'

          "$RUNNER_TEMP/kubernetes/test/bin/e2e.test" \
            --kubeconfig="$RUNNER_TEMP/kubeconfig.yaml" \
            --provider=skeleton \
            --num-nodes=1 \
            --disable-log-dump \
            --ginkgo.no-color \
            --ginkgo.focus="$EXPERIMENTAL_FOCUS"

      - name: Tear down background processes
        if: always()
        run: |
          sudo pkill -f k8flare-agent || true
          pkill -f k8flare-scheduler || true
          pkill -f k8flare-controller-manager || true
          pkill -f "wrangler dev" || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-conformance-logs-${{ matrix.controlplane }}
          path: |
            ${{ runner.temp }}/wrangler.log
            ${{ runner.temp }}/agent.log
            ${{ runner.temp }}/scheduler.log
            ${{ runner.temp }}/controller-manager.log
          if-no-files-found: ignore
